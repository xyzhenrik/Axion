<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Axion — Fullscreen player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.i{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.gd{background:rgba(20,22,28,.38);-webkit-backdrop-filter:blur(24px) saturate(170%) brightness(.9);backdrop-filter:blur(24px) saturate(170%) brightness(.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.36),inset 0 -1px 0 rgba(255,255,255,.08),inset 0 0 0 .5px rgba(255,255,255,.22),inset 14px 14px 26px -16px rgba(255,255,255,.34),0 18px 50px rgba(0,0,0,.45)}
.cb{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.scene{position:absolute;overflow:hidden;background:linear-gradient(#0E2433 0%,#24506A 38%,#C9805E 66%,#F2C38A 74%,#1A3A4A 74.2%,#0B2230 100%)}
</style>
</helmet>
<div style="width: 1600px; height: 1000px; position: relative; overflow: hidden; background: #000000; font-family: Inter, system-ui, sans-serif; color: #FFFFFF">
  <div class="scene" role="img" aria-label="Video frame: a lighthouse on a cliff at dusk" style="inset: 0">
    <div style="position: absolute; left: 980px; top: 610px; width: 150px; height: 150px; border-radius: 50%; background: #FFE2A8; opacity: .95"></div>
    <div style="position: absolute; left: 0; right: 0; top: 740px; bottom: 0; background: #0B2230"></div>
    <div style="position: absolute; left: 1010px; top: 760px; width: 90px; height: 5px; border-radius: 3px; background: #F2C38A; opacity: .7"></div>
    <div style="position: absolute; left: 975px; top: 790px; width: 160px; height: 5px; border-radius: 3px; background: #F2C38A; opacity: .45"></div>
    <div style="position: absolute; left: 1025px; top: 822px; width: 60px; height: 5px; border-radius: 3px; background: #F2C38A; opacity: .35"></div>
    <div style="position: absolute; left: 0; top: 470px; width: 640px; height: 530px; background: #08151D; clip-path: polygon(0 0, 30% 4%, 58% 22%, 78% 40%, 100% 72%, 100% 100%, 0 100%)"></div>
    <div style="position: absolute; left: 236px; top: 290px; width: 46px; height: 196px; background: #E9E2D4; clip-path: polygon(18% 0, 82% 0, 100% 100%, 0 100%)"></div>
    <div style="position: absolute; left: 236px; top: 340px; width: 46px; height: 22px; background: #B5452F"></div>
    <div style="position: absolute; left: 236px; top: 410px; width: 46px; height: 22px; background: #B5452F"></div>
    <div style="position: absolute; left: 230px; top: 262px; width: 58px; height: 30px; border-radius: 6px 6px 0 0; background: #FFE9A8; box-shadow: 0 0 60px 20px rgba(255,226,150,.55)"></div>
    <div style="position: absolute; left: 288px; top: 210px; width: 900px; height: 130px; background: rgba(255,233,168,.16); clip-path: polygon(0 40%, 100% 0, 100% 100%, 0 60%)"></div>
  </div>

  <div class="gd" style="position: absolute; left: 32px; top: 28px; height: 52px; border-radius: 999px; display: flex; align-items: center; gap: 12px; padding: 0 20px 0 8px">
    <span style="width: 36px; height: 36px; border-radius: 10px; background: #1F9D57; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800">FR</span>
    <span style="display: flex; flex-direction: column">
      <span style="font-size: 15px; font-weight: 650">Low Tide — a short film</span>
      <span style="font-size: 12px; color: #D5D9E1">Field Radio Films · 4K HDR</span>
    </span>
  </div>

  <div class="gd" role="tooltip" style="position: absolute; left: 873px; bottom: 132px; width: 228px; border-radius: 20px; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; align-items: center">
    <div class="scene" style="position: relative; width: 212px; height: 119px; border-radius: 13px">
      <div style="position: absolute; left: 60px; top: 70px; width: 22px; height: 22px; border-radius: 50%; background: #FFE2A8"></div>
      <div style="position: absolute; left: 0; top: 84px; width: 110px; height: 40px; background: #08151D; clip-path: polygon(0 0, 50% 20%, 100% 100%, 0 100%)"></div>
    </div>
    <span style="font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums">18:05 · The keeper's log</span>
  </div>

  <div class="gd" role="group" aria-label="Video controls" style="position: absolute; left: 64px; right: 64px; bottom: 40px; height: 72px; border-radius: 999px; display: flex; align-items: center; gap: 6px; padding: 0 14px; box-sizing: border-box">
    <button class="cb" aria-label="Back 10 seconds"><svg class="i" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"></path><text x="12" y="15" style="text-anchor: middle; font-size: 7px; font-weight: 700; fill: currentColor; stroke: none">10</text></svg></button>
    <button class="cb" aria-label="Pause" style="width: 56px; height: 56px; background: rgba(255,255,255,.18)"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"></path></svg></button>
    <button class="cb" aria-label="Forward 10 seconds"><svg class="i" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4.5h-4.5"></path><text x="12" y="15" style="text-anchor: middle; font-size: 7px; font-weight: 700; fill: currentColor; stroke: none">10</text></svg></button>

    <span style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; width: 56px; text-align: right; margin-left: 8px">12:48</span>
    <div role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="1620" aria-valuenow="768" aria-valuetext="12 minutes 48 seconds" tabindex="0" style="flex: 1; height: 28px; position: relative; display: flex; align-items: center; margin: 0 10px">
      <div style="position: absolute; left: 0; right: 0; height: 6px; border-radius: 3px; background: rgba(255,255,255,.22)"></div>
      <div style="position: absolute; left: 0; width: 68%; height: 6px; border-radius: 3px; background: rgba(255,255,255,.34)"></div>
      <div style="position: absolute; left: 0; width: 47.4%; height: 6px; border-radius: 3px; background: #FFFFFF"></div>
      <div style="position: absolute; left: 66.8%; width: 2px; height: 18px; border-radius: 1px; background: #FFFFFF; opacity: .8"></div>
      <div style="position: absolute; left: 47.4%; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 8px rgba(0,0,0,.4)"></div>
    </div>
    <span style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; width: 60px; color: #D5D9E1">−14:12</span>

    <div style="width: 1px; height: 28px; background: rgba(255,255,255,.2); margin: 0 6px"></div>
    <button class="cb" aria-label="Mute"><svg class="i" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9.5h3.5L12.5 5.5v13l-5-4H4zM16 9a4.5 4.5 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"></path></svg></button>
    <div role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70" tabindex="0" style="width: 110px; height: 28px; position: relative; display: flex; align-items: center; margin-right: 6px">
      <div style="position: absolute; left: 0; right: 0; height: 6px; border-radius: 3px; background: rgba(255,255,255,.22)"></div>
      <div style="position: absolute; left: 0; width: 70%; height: 6px; border-radius: 3px; background: #FFFFFF"></div>
    </div>
    <button aria-label="Playback speed" style="height: 36px; padding: 0 12px; border-radius: 999px; font-size: 14px; font-weight: 700; background: rgba(255,255,255,.12); font-variant-numeric: tabular-nums">1.25×</button>
    <button class="cb" aria-label="Captions" aria-pressed="true"><svg class="i" viewBox="0 0 24 24" width="23" height="23" aria-hidden="true"><path d="M4.5 5h15A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11A1.5 1.5 0 0 1 4.5 5zM10.5 10.2a2.5 2.5 0 1 0 0 3.6M17 10.2a2.5 2.5 0 1 0 0 3.6"></path></svg></button>
    <button class="cb" aria-label="Picture in Picture"><svg class="i" viewBox="0 0 24 24" width="23" height="23" aria-hidden="true"><path d="M4.5 5h15A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11A1.5 1.5 0 0 1 4.5 5zM12.5 12h5.5v4.5h-5.5z"></path></svg></button>
    <button class="cb" aria-label="Exit fullscreen"><svg class="i" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"></path></svg></button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
