<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Axion — 700 px, compact capsule</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.i{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.gl{background:rgba(255,255,255,.40);-webkit-backdrop-filter:blur(22px) saturate(190%) brightness(1.06);backdrop-filter:blur(22px) saturate(190%) brightness(1.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.4),inset 0 0 0 .5px rgba(255,255,255,.65),inset 14px 14px 24px -16px rgba(255,255,255,1),inset -12px -12px 24px -18px rgba(255,255,255,.75),0 14px 40px rgba(12,20,40,.22),0 1px 3px rgba(12,20,40,.12)}
.serif{font-family:Fraunces,Georgia,serif}
</style>
</helmet>
<div style="width: 700px; height: 1000px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; background: #FFF8F0; color: #111318">

  <main aria-label="Web page: Tidewater" style="position: absolute; inset: 0">
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 560px; background: #FFB070">
      <div style="position: absolute; left: 470px; top: 170px; width: 150px; height: 150px; border-radius: 50%; background: #FFE38A"></div>
      <div style="position: absolute; left: 0; right: 0; top: 230px; height: 230px; background: #EC6A8A; clip-path: polygon(0 70%, 14% 36%, 28% 58%, 44% 12%, 58% 50%, 72% 22%, 86% 52%, 100% 30%, 100% 100%, 0 100%)"></div>
      <div style="position: absolute; left: 0; right: 0; top: 300px; height: 210px; background: #8E3FA6; clip-path: polygon(0 50%, 16% 26%, 32% 64%, 50% 20%, 66% 62%, 82% 30%, 100% 58%, 100% 100%, 0 100%)"></div>
      <div style="position: absolute; left: 0; right: 0; top: 380px; height: 140px; background: #33296E; clip-path: polygon(0 40%, 22% 70%, 40% 30%, 62% 74%, 80% 40%, 100% 66%, 100% 100%, 0 100%)"></div>
      <div style="position: absolute; left: 0; right: 0; top: 500px; height: 60px; background: #1C5FA6"></div>

      <div style="position: absolute; left: 24px; right: 24px; top: 92px; display: flex; align-items: center; justify-content: space-between; color: #FFFFFF">
        <div class="serif" style="font-size: 22px; font-weight: 700; letter-spacing: .04em">TIDEWATER</div>
        <button aria-label="Site menu" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
      </div>
      <div style="position: absolute; left: 24px; right: 24px; top: 176px; display: flex; flex-direction: column; gap: 14px; color: #FFFFFF">
        <div style="font-size: 12px; font-weight: 700; letter-spacing: .14em">FIELD NOTES · ISSUE 31</div>
        <h1 class="serif" style="margin: 0; font-size: 44px; line-height: 48px; font-weight: 700; letter-spacing: -0.02em; max-width: 520px">Nine slow days along the northern coast</h1>
        <p style="margin: 0; font-size: 16px; line-height: 24px; max-width: 440px; opacity: .92">Ferries, fish soup and the long blue hour — a route planned entirely around the tides.</p>
      </div>
    </div>

    <section style="position: absolute; left: 24px; right: 24px; top: 592px; display: flex; flex-direction: column; gap: 16px">
      <h2 class="serif" style="margin: 0; font-size: 24px; font-weight: 700">Latest field notes</h2>
      <article style="display: flex; flex-direction: column; gap: 12px">
        <div style="height: 250px; border-radius: 20px; position: relative; overflow: hidden; background: #BFE3F5">
          <div style="position: absolute; left: 62%; top: 40px; width: 130px; height: 130px; border-radius: 50%; background: #FFE38A"></div>
          <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 110px; background: #1C5FA6; clip-path: polygon(0 50%, 20% 20%, 42% 60%, 64% 10%, 84% 46%, 100% 24%, 100% 100%, 0 100%)"></div>
        </div>
        <div style="font-size: 12px; font-weight: 700; letter-spacing: .1em; color: #3F4554">ISLANDS</div>
        <div class="serif" style="font-size: 21px; line-height: 27px; font-weight: 600; margin-top: -4px">Where the ferry only runs on Tuesdays</div>
      </article>
    </section>
  </main>

  <div class="gl" role="toolbar" aria-label="Navigation" style="position: absolute; left: 16px; right: 16px; top: 16px; height: 56px; border-radius: 999px; display: flex; align-items: center; gap: 2px; padding: 0 7px; box-sizing: border-box">
    <button aria-label="Show sidebar" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="{{ic.sidebar}}"></path></svg></button>
    <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="{{ic.back}}"></path></svg></button>
    <div style="flex: 1; min-width: 0; height: 44px; margin: 0 4px; border-radius: 999px; background: rgba(255,255,255,.88); box-shadow: 0 2px 10px rgba(0,0,0,.10); display: flex; align-items: center; gap: 6px; padding: 0 6px 0 8px">
      <button aria-label="Shields for tidewater.travel" style="width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #1F9D57"><svg class="i" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="{{ic.shield}}"></path></svg></button>
      <span style="flex: 1; text-align: center; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">tidewater.travel</span>
      <button aria-label="Reload" style="width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="{{ic.reload}}"></path></svg></button>
    </div>
    <button aria-label="Tab overview, 5 tabs open" style="position: relative; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center">
      <span style="width: 22px; height: 22px; border-radius: 7px; border: 1.75px solid currentColor; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums">5</span>
    </button>
    <button aria-label="More" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" width="21" height="21" aria-hidden="true" style="stroke-width: 2.6"><path d="M5.5 12h.01M12 12h.01M18.5 12h.01"></path></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":700,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      ic: {
        back: 'M15 5l-7 7 7 7',
        sidebar: 'M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM9.5 4v16',
        shield: 'M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6zM9 12l2 2 4-4',
        reload: 'M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5'
      }
    };
  }
}
</script>
</body>
</html>
