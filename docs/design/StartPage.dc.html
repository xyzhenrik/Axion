<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Axion — Start page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.i{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.g{background:rgba(255,255,255,.26);-webkit-backdrop-filter:blur(24px) saturate(180%) brightness(1.02);backdrop-filter:blur(24px) saturate(180%) brightness(1.02);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -1px 0 rgba(255,255,255,.25),inset 0 0 0 .5px rgba(255,255,255,.45),inset 14px 14px 24px -16px rgba(255,255,255,.75),0 14px 40px rgba(10,10,30,.25)}
.gs{background:rgba(24,22,40,.40);-webkit-backdrop-filter:blur(28px) saturate(170%) brightness(.9);backdrop-filter:blur(28px) saturate(170%) brightness(.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.34),inset 0 0 0 .5px rgba(255,255,255,.2),inset 14px 14px 24px -16px rgba(255,255,255,.3),0 16px 44px rgba(0,0,0,.35)}
.h{margin:0;font-size:20px;font-weight:700;letter-spacing:-0.01em;text-shadow:0 1px 12px rgba(0,0,0,.25)}
.handle{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width: 1600px; height: 1000px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #FFFFFF; background: {{w.sky}}">
  <div aria-hidden="true" style="position: absolute; inset: 0">
    <div style="position: absolute; left: 1080px; top: 170px; width: 260px; height: 260px; border-radius: 50%; background: {{w.sun}}"></div>
    <div style="position: absolute; left: -300px; top: 420px; width: 1300px; height: 900px; border-radius: 50%; background: {{w.h1}}"></div>
    <div style="position: absolute; left: 700px; top: 470px; width: 1300px; height: 900px; border-radius: 50%; background: {{w.h2}}"></div>
    <div style="position: absolute; left: 100px; top: 620px; width: 1500px; height: 900px; border-radius: 50%; background: {{w.h3}}"></div>
    <div style="position: absolute; left: -400px; top: 760px; width: 1400px; height: 800px; border-radius: 50%; background: {{w.h4}}"></div>
  </div>

  <div class="g" role="search" style="position: absolute; left: 470px; width: 660px; top: 20px; height: 56px; border-radius: 999px; display: flex; align-items: center; gap: 4px; padding: 0 7px; box-sizing: border-box">
    <button aria-label="Show sidebar" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM9.5 4v16"></path></svg></button>
    <label style="flex: 1; height: 44px; border-radius: 999px; background: rgba(255,255,255,.9); color: #111318; display: flex; align-items: center; gap: 10px; padding: 0 16px; box-shadow: 0 2px 10px rgba(0,0,0,.1)">
      <svg class="i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="color: #4A5060"><path d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zM16.2 16.2L20.5 20.5"></path></svg>
      <input type="search" placeholder="Search or enter website" aria-label="Search or enter website" style="flex: 1; border: 0; outline: 0; background: transparent; font-size: 15px; text-align: center">
    </label>
    <button aria-label="Tab overview, 6 tabs open" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center"><span style="width: 22px; height: 22px; border-radius: 7px; border: 1.75px solid currentColor; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">6</span></button>
  </div>

  <main style="position: absolute; left: 220px; right: 220px; top: 120px; display: flex; flex-direction: column; gap: 40px">
    <section aria-label="Favourites" style="display: flex; flex-direction: column; gap: 16px; border-radius: 26px; outline: {{e.outline}}; outline-offset: 10px">
      <div style="display: flex; align-items: center; gap: 8px">
        <sc-if value="{{editing}}" hint-placeholder-val="{{false}}"><span class="handle" aria-hidden="true"><svg class="i" viewBox="0 0 24 24" width="18" height="18"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" style="stroke-width: 3"></path></svg></span></sc-if>
        <h2 class="h" style="flex: 1">Favourites</h2>
        <sc-if value="{{editing}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; font-weight: 600; opacity: .9">Drag to reorder</span></sc-if>
      </div>
      <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 20px">
        <sc-for list="{{favs}}" as="f" hint-placeholder-count="8">
          <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-decoration: none; position: relative">
            <span class="g" style="width: 104px; height: 104px; border-radius: 26px; display: flex; align-items: center; justify-content: center; transform: {{e.tilt}}">
              <span style="width: 56px; height: 56px; border-radius: 16px; background: {{f.color}}; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; box-shadow: inset 0 1px 0 rgba(255,255,255,.4)">{{f.mono}}</span>
            </span>
            <sc-if value="{{editing}}" hint-placeholder-val="{{false}}"><span aria-label="Remove {{f.name}}" role="img" style="position: absolute; left: 6px; top: -6px; width: 26px; height: 26px; border-radius: 50%; background: #3A3E48; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,.3)"><svg class="i" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="stroke-width: 2.6"><path d="M6 12h12"></path></svg></span></sc-if>
            <span style="font-size: 13px; font-weight: 600; text-shadow: 0 1px 8px rgba(0,0,0,.35)">{{f.name}}</span>
          </a>
        </sc-for>
      </div>
    </section>

    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 28px">
      <section aria-label="Frequently visited" style="display: flex; flex-direction: column; gap: 16px; border-radius: 26px; outline: {{e.outline}}; outline-offset: 10px">
        <div style="display: flex; align-items: center; gap: 8px">
          <sc-if value="{{editing}}" hint-placeholder-val="{{false}}"><span class="handle" aria-hidden="true"><svg class="i" viewBox="0 0 24 24" width="18" height="18"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" style="stroke-width: 3"></path></svg></span></sc-if>
          <h2 class="h" style="flex: 1">Frequently visited</h2>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px">
          <sc-for list="{{frequent}}" as="v" hint-placeholder-count="3">
            <a href="#" class="g" style="border-radius: 22px; padding: 8px; display: flex; flex-direction: column; gap: 10px; text-decoration: none">
              <span style="height: 140px; border-radius: 15px; background: {{v.bg}}; position: relative; overflow: hidden; display: block">
                <span style="position: absolute; left: 14px; top: 14px; width: 60%; height: 10px; border-radius: 5px; background: {{v.c1}}"></span>
                <span style="position: absolute; left: 14px; top: 34px; width: 40%; height: 8px; border-radius: 4px; background: {{v.c2}}"></span>
                <span style="position: absolute; left: 14px; right: 14px; top: 58px; bottom: 14px; border-radius: 10px; background: {{v.c3}}"></span>
              </span>
              <span style="display: flex; align-items: center; gap: 10px; padding: 0 6px 6px">
                <span style="width: 22px; height: 22px; border-radius: 6px; background: {{v.color}}; flex-shrink: 0"></span>
                <span style="display: flex; flex-direction: column; min-width: 0">
                  <span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{v.title}}</span>
                  <span style="font-size: 12px; opacity: .85">{{v.domain}}</span>
                </span>
              </span>
            </a>
          </sc-for>
        </div>
      </section>

      <section aria-label="Shields this week" style="display: flex; flex-direction: column; gap: 16px; border-radius: 26px; outline: {{e.outline}}; outline-offset: 10px">
        <div style="display: flex; align-items: center; gap: 8px">
          <sc-if value="{{editing}}" hint-placeholder-val="{{false}}"><span class="handle" aria-hidden="true"><svg class="i" viewBox="0 0 24 24" width="18" height="18"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01" style="stroke-width: 3"></path></svg></span></sc-if>
          <h2 class="h" style="flex: 1">Shields this week</h2>
        </div>
        <div class="gs" style="border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 14px; flex: 1">
          <div style="display: flex; align-items: flex-start; justify-content: space-between">
            <div>
              <div style="font-size: 40px; line-height: 44px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">1,482</div>
              <div style="font-size: 14px; color: #E2E5EC">trackers &amp; ads blocked</div>
            </div>
            <span style="width: 40px; height: 40px; border-radius: 12px; background: rgba(95,211,148,.2); color: #7BE0A8; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6zM9 12l2 2 4-4"></path></svg></span>
          </div>
          <div role="img" aria-label="Blocked per day, Monday to Sunday: 168, 241, 190, 276, 233, 182, 192" style="display: flex; align-items: flex-end; gap: 8px; height: 56px">
            <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
              <span style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px">
                <span style="width: 100%; border-radius: 4px; background: {{d.color}}; height: {{d.h}}"></span>
                <span style="font-size: 10px; font-weight: 600; color: #D5D9E1">{{d.l}}</span>
              </span>
            </sc-for>
          </div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
            <div style="border-radius: 14px; background: rgba(255,255,255,.1); padding: 10px 12px"><div style="font-size: 18px; font-weight: 700">≈ 41 min</div><div style="font-size: 12px; color: #E2E5EC">time saved</div></div>
            <div style="border-radius: 14px; background: rgba(255,255,255,.1); padding: 10px 12px"><div style="font-size: 18px; font-weight: 700">≈ 312 MB</div><div style="font-size: 12px; color: #E2E5EC">data saved</div></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <sc-if value="{{notEditing}}" hint-placeholder-val="{{true}}">
    <button class="g" style="position: absolute; right: 32px; bottom: 32px; height: 48px; border-radius: 999px; padding: 0 20px 0 16px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 650"><svg class="i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4"></path></svg>Edit</button>
  </sc-if>

  <sc-if value="{{editing}}" hint-placeholder-val="{{false}}">
    <section class="gs" aria-label="Customize start page" style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); width: 900px; border-radius: 28px; padding: 18px 20px; box-sizing: border-box; display: flex; gap: 28px; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #D5D9E1">Wallpaper</span>
        <div style="display: flex; gap: 10px">
          <sc-for list="{{wallpapers}}" as="wp" hint-placeholder-count="4">
            <button aria-label="{{wp.name}}" aria-pressed="{{wp.pressed}}" style="width: 84px; height: 56px; border-radius: 12px; overflow: hidden; position: relative; background: {{wp.sky}}; box-shadow: {{wp.ring}}">
              <span style="position: absolute; left: 50px; top: 8px; width: 18px; height: 18px; border-radius: 50%; background: {{wp.sun}}"></span>
              <span style="position: absolute; left: -20px; top: 26px; width: 90px; height: 60px; border-radius: 50%; background: {{wp.h1}}"></span>
              <span style="position: absolute; left: 30px; top: 34px; width: 90px; height: 60px; border-radius: 50%; background: {{wp.h3}}"></span>
            </button>
          </sc-for>
        </div>
      </div>
      <div style="flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 20px; row-gap: 4px">
        <sc-for list="{{sections}}" as="sec" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 10px; height: 38px; font-size: 14px; font-weight: 500">
            <span style="flex: 1">{{sec.name}}</span>
            <span role="img" aria-label="{{sec.state}}" style="width: 44px; height: 26px; border-radius: 999px; background: {{sec.track}}; position: relative"><span style="position: absolute; top: 2px; left: {{sec.knob}}; width: 28px; height: 22px; border-radius: 999px; background: #FFFFFF"></span></span>
          </div>
        </sc-for>
      </div>
      <button style="height: 44px; padding: 0 22px; border-radius: 999px; font-size: 15px; font-weight: 700; color: #FFFFFF; background: {{accent}}; box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 6px 16px rgba(46,107,255,.4)">Done</button>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"wallpaper":{"editor":"enum","options":["Dusk","Tide","Graphite","Meadow"],"default":"Dusk"},"editing":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#2E6BFF","options":["#2E6BFF","#5B5BF0","#E2457A","#F2742B"]},"$preview":{"width":1600,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent ?? '#2E6BFF';
    var editing = this.props.editing ?? false;
    var current = this.props.wallpaper ?? 'Dusk';
    var papers = {
      Dusk: { sky: '#F2A46E', sun: '#FFE7A6', h1: '#E26A8C', h2: '#B04A92', h3: '#6A3290', h4: '#2E1D52' },
      Tide: { sky: '#8FCBE3', sun: '#FFF3C4', h1: '#4DA3C7', h2: '#2C7AA8', h3: '#1A4F7A', h4: '#0E2C47' },
      Graphite: { sky: '#4A4E58', sun: '#9AA0AC', h1: '#3A3D46', h2: '#2E3139', h3: '#22252C', h4: '#16181D' },
      Meadow: { sky: '#BFDCA8', sun: '#FFF0B0', h1: '#7FB069', h2: '#4E8C4A', h3: '#2F6640', h4: '#1B3F2C' }
    };
    var w = papers[current] || papers.Dusk;
    var dayVals = [168, 241, 190, 276, 233, 182, 192];
    var max = 276;
    return {
      accent: accent, editing: editing, notEditing: !editing, w: w,
      e: { outline: editing ? '2px dashed rgba(255,255,255,.7)' : 'none', tilt: editing ? 'rotate(-1.5deg)' : 'none' },
      favs: [
        { name: 'Tidewater', mono: 'T', color: '#F2742B' },
        { name: 'Kestrel Docs', mono: 'K', color: '#7C5CFF' },
        { name: 'Field Radio', mono: 'FR', color: '#1F9D57' },
        { name: 'Harbour', mono: 'H', color: '#E2457A' },
        { name: 'Ferries', mono: 'F', color: '#1C5FA6' },
        { name: 'Weather', mono: 'W', color: '#D98A06' },
        { name: 'Mail', mono: 'M', color: '#2E6BFF' },
        { name: 'Notes', mono: 'N', color: '#5E636E' }
      ],
      frequent: [
        { title: 'Kestrel Docs — API reference', domain: 'docs.kestrel.dev', color: '#7C5CFF', bg: '#FFFFFF', c1: '#1B1830', c2: '#CFC6F5', c3: '#F1EEFF' },
        { title: 'Tidewater — Journal', domain: 'tidewater.travel', color: '#F2742B', bg: '#FFB070', c1: '#FFFFFF', c2: '#FFE38A', c3: '#8E3FA6' },
        { title: 'Low Tide Sessions', domain: 'fieldradio.fm', color: '#1F9D57', bg: '#0F3B36', c1: '#6FD3A8', c2: '#FFFFFF', c3: '#1F9D57' }
      ],
      days: dayVals.map(function (v, i) {
        return { l: 'MTWTFSS'[i], h: Math.round(v / max * 40) + 'px', color: i === 6 ? '#7BE0A8' : 'rgba(255,255,255,.45)' };
      }),
      wallpapers: Object.keys(papers).map(function (k) {
        var p = papers[k];
        return { name: k + ' wallpaper', sky: p.sky, sun: p.sun, h1: p.h1, h3: p.h3, pressed: k === current ? 'true' : 'false',
          ring: k === current ? '0 0 0 3px #FFFFFF, 0 0 0 5px ' + accent : '0 0 0 1px rgba(255,255,255,.3)' };
      }),
      sections: [
        { name: 'Favourites', on: true }, { name: 'Frequently visited', on: true },
        { name: 'Shields stats', on: true }, { name: 'Reading List', on: false }
      ].map(function (s) {
        return { name: s.name, state: s.on ? 'Shown' : 'Hidden', track: s.on ? '#1F9D57' : 'rgba(255,255,255,.25)', knob: s.on ? '14px' : '2px' };
      })
    };
  }
}
</script>
</body>
</html>
