<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Axion — Shields popover</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.i{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.pop-l{background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(36px) saturate(190%) brightness(1.06);backdrop-filter:blur(36px) saturate(190%) brightness(1.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.45),inset 0 0 0 .5px rgba(255,255,255,.7),inset 16px 16px 30px -20px rgba(255,255,255,1),0 30px 80px rgba(12,20,40,.32),0 4px 14px rgba(12,20,40,.14)}
.pop-d{background:rgba(26,28,36,.64);-webkit-backdrop-filter:blur(36px) saturate(165%) brightness(.8);backdrop-filter:blur(36px) saturate(165%) brightness(.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.30),inset 0 0 0 .5px rgba(255,255,255,.18),inset 16px 16px 30px -20px rgba(255,255,255,.28),0 30px 80px rgba(0,0,0,.6)}
.neck-l{background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(36px) saturate(190%);backdrop-filter:blur(36px) saturate(190%);box-shadow:inset 1px 0 0 rgba(255,255,255,.9),inset -1px 0 0 rgba(255,255,255,.9)}
.neck-d{background:rgba(26,28,36,.64);-webkit-backdrop-filter:blur(36px) saturate(165%) brightness(.8);backdrop-filter:blur(36px) saturate(165%) brightness(.8);box-shadow:inset 1px 0 0 rgba(255,255,255,.22),inset -1px 0 0 rgba(255,255,255,.22)}
</style>
</helmet>
<div style="width: 1600px; height: 1000px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: {{t.label}}">
  <div style="position: absolute; inset: 0">
    <dc-import name="Window" dark="{{dark}}" hint-size="1600px,1000px"></dc-import>
  </div>

  <div class="{{t.neck}}" aria-hidden="true" style="position: absolute; left: 464px; top: 50px; width: 28px; height: 44px; border-radius: 14px"></div>
  <div class="{{t.pop}}" aria-hidden="true" style="position: absolute; left: 457px; top: 23px; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #1F9D57">
    <svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="{{ic.shield}}"></path></svg>
  </div>

  <section class="{{t.pop}}" role="dialog" aria-label="Shields for tidewater.travel" style="position: absolute; left: 340px; top: 86px; width: 410px; border-radius: 28px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 14px">
      <div style="width: 44px; height: 44px; border-radius: 12px; background: #F2742B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 22px">T</div>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 17px; font-weight: 650">tidewater.travel</div>
        <div style="font-size: 13px; font-weight: 500; color: {{t.green}}">Shields are up for this site</div>
      </div>
      <button role="switch" aria-checked="true" aria-label="Shields for this site" style="width: 66px; height: 40px; border-radius: 999px; background: #1F9D57; position: relative; flex-shrink: 0; box-shadow: inset 0 1px 2px rgba(0,0,0,.2)"><span style="position: absolute; right: 3px; top: 3px; width: 42px; height: 34px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 2px 8px rgba(0,0,0,.28)"></span></button>
    </div>

    <div role="radiogroup" aria-label="Blocking level" style="height: 44px; border-radius: 999px; background: {{t.well}}; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px; box-sizing: border-box; gap: 4px">
      <button role="radio" aria-checked="false" style="border-radius: 999px; font-size: 14px; font-weight: 500; color: {{t.secondary}}">Off</button>
      <button role="radio" aria-checked="true" style="border-radius: 999px; font-size: 14px; font-weight: 650; background: {{t.selected}}; box-shadow: 0 2px 8px rgba(0,0,0,.14)">Standard</button>
      <button role="radio" aria-checked="false" style="border-radius: 999px; font-size: 14px; font-weight: 500; color: {{t.secondary}}">Aggressive</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: {{t.secondary}}">Blocked on this page</span>
        <span style="font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums">30 total</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{counters}}" as="c" hint-placeholder-count="4">
          <div style="border-radius: 18px; background: {{t.well}}; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px">
            <div style="display: flex; justify-content: space-between; align-items: center">
              <span style="font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">{{c.n}}</span>
              <svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="color: {{t.secondary}}"><path d="{{c.d}}"></path></svg>
            </div>
            <span style="font-size: 13px; line-height: 17px; color: {{t.secondary}}">{{c.label}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; border-radius: 18px; background: {{t.well}}; padding: 4px 16px">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 54px; border-bottom: 1px solid {{t.hair}}">
        <div style="flex: 1">
          <div style="font-size: 15px; font-weight: 500">Block third-party cookies</div>
        </div>
        <button role="switch" aria-checked="true" aria-label="Block third-party cookies" style="width: 52px; height: 32px; border-radius: 999px; background: {{accent}}; position: relative; flex-shrink: 0"><span style="position: absolute; right: 2px; top: 2px; width: 34px; height: 28px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,.25)"></span></button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 60px">
        <div style="flex: 1">
          <div style="font-size: 15px; font-weight: 500">Block scripts</div>
          <div style="font-size: 12px; color: {{t.secondary}}">Can break menus, video and logins</div>
        </div>
        <button role="switch" aria-checked="false" aria-label="Block scripts" style="width: 52px; height: 32px; border-radius: 999px; background: {{t.trackOff}}; position: relative; flex-shrink: 0"><span style="position: absolute; left: 2px; top: 2px; width: 34px; height: 28px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,.25)"></span></button>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
      <a href="#" style="font-size: 14px; font-weight: 600; color: {{t.link}}; text-decoration: none; display: flex; align-items: center; gap: 6px"><svg class="i" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 21V4.5M5 4.5h11l-2 4 2 4H5"></path></svg>Report broken site</a>
      <a href="#" style="font-size: 14px; font-weight: 500; color: {{t.secondary}}; text-decoration: none">Shields settings</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#2E6BFF","options":["#2E6BFF","#5B5BF0","#E2457A","#F2742B"]},"$preview":{"width":1600,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.dark ?? false;
    var accent = this.props.accent ?? '#2E6BFF';
    var ic = {
      shield: 'M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6zM9 12l2 2 4-4',
      tracker: 'M12 4a8 8 0 1 1 0 16 8 8 0 0 1 0-16zM12 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6zM5.6 5.6l12.8 12.8',
      popup: 'M4 6.5A1.5 1.5 0 0 1 5.5 5h13A1.5 1.5 0 0 1 20 6.5v11a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5zM4 9h16M10 13l4 4M14 13l-4 4',
      redirect: 'M4 17h9a4 4 0 0 0 0-8H6M9 5L5 9l4 4',
      finger: 'M8 20c-1-2-1.5-4.5-1.5-7a5.5 5.5 0 0 1 11 0M12 13c0 3 .5 5 1.5 7M15.5 19c.6-1.4 1-3.4 1-5M9.5 13a2.5 2.5 0 0 1 5 0'
    };
    return {
      dark: dark,
      accent: accent,
      ic: ic,
      t: {
        pop: dark ? 'pop-d' : 'pop-l',
        neck: dark ? 'neck-d' : 'neck-l',
        label: dark ? '#F5F6F8' : '#111318',
        secondary: dark ? '#BCC2CE' : '#3F4554',
        green: dark ? '#5FD394' : '#16804A',
        link: dark ? '#8FB2FF' : accent,
        well: dark ? 'rgba(255,255,255,.08)' : 'rgba(255,255,255,.55)',
        selected: dark ? 'rgba(255,255,255,.22)' : '#FFFFFF',
        hair: dark ? 'rgba(255,255,255,.12)' : 'rgba(17,19,24,.10)',
        trackOff: dark ? 'rgba(255,255,255,.22)' : 'rgba(17,19,24,.18)'
      },
      counters: [
        { n: '23', label: 'Ads & trackers', d: ic.tracker },
        { n: '2', label: 'Popups', d: ic.popup },
        { n: '1', label: 'Redirects', d: ic.redirect },
        { n: '4', label: 'Fingerprinting attempts', d: ic.finger }
      ]
    };
  }
}
</script>
</body>
</html>
