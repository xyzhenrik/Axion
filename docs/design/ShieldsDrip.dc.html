<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Axion — Shields popover drip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.i{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.stage{position:relative;height:280px;border-radius:20px;overflow:hidden;background:#FFB070}
.stage::before{content:"";position:absolute;left:0;right:0;top:120px;height:110px;background:#EC6A8A;clip-path:polygon(0 70%,14% 30%,28% 58%,44% 10%,60% 52%,74% 20%,88% 50%,100% 30%,100% 100%,0 100%)}
.stage::after{content:"";position:absolute;left:0;right:0;top:200px;bottom:0;background:#33296E}
.g{position:absolute;z-index:1;background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(18px) saturate(190%) brightness(1.06);backdrop-filter:blur(18px) saturate(190%) brightness(1.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 .5px rgba(255,255,255,.7),inset 10px 10px 18px -12px rgba(255,255,255,1),0 10px 28px rgba(12,20,40,.22)}
.n{position:absolute;z-index:1;background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(18px) saturate(190%) brightness(1.06);backdrop-filter:blur(18px) saturate(190%) brightness(1.06);box-shadow:inset 1px 0 0 rgba(255,255,255,.9),inset -1px 0 0 rgba(255,255,255,.9)}
.ic{position:absolute;z-index:2;color:#16804A;display:flex;align-items:center;justify-content:center}
.line{height:7px;border-radius:4px;background:rgba(17,19,24,.16)}
</style>
</helmet>
<div style="width: 1200px; height: 520px; box-sizing: border-box; padding: 40px 48px; background: #F3F4F7; color: #111318; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">
  <div style="display: flex; justify-content: space-between; align-items: baseline">
    <h2 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.01em">The popover drips out of the shield button</h2>
    <span class="mono" style="font-size: 12px; color: #4A5060">spring: liquid · response 0.50 · ζ 0.62</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
      <div class="stage">
        <div class="g" style="left: 109px; top: 28px; width: 44px; height: 44px; border-radius: 50%"></div>
        <div class="ic" style="left: 109px; top: 28px; width: 44px; height: 44px"><svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="{{shield}}"></path></svg></div>
      </div>
      <figcaption style="display: flex; flex-direction: column; gap: 3px">
        <span class="mono" style="font-size: 12px; color: #2E6BFF">0 ms · press</span>
        <span style="font-size: 14px; line-height: 20px; color: #2F3440">The button swells by 6% and its tint brightens.</span>
      </figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
      <div class="stage">
        <div class="g" style="left: 106px; top: 26px; width: 50px; height: 46px; border-radius: 50%"></div>
        <div class="g" style="left: 113px; top: 60px; width: 36px; height: 34px; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; box-shadow: inset 0 -1px 0 rgba(255,255,255,.9), 0 6px 14px rgba(12,20,40,.18)"></div>
        <div class="ic" style="left: 106px; top: 26px; width: 50px; height: 46px"><svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="{{shield}}"></path></svg></div>
      </div>
      <figcaption style="display: flex; flex-direction: column; gap: 3px">
        <span class="mono" style="font-size: 12px; color: #2E6BFF">≈ 60 ms · bulge</span>
        <span style="font-size: 14px; line-height: 20px; color: #2F3440">A droplet sags out of the bottom edge. The two SDFs are joined with a smooth-min.</span>
      </figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
      <div class="stage">
        <div class="n" style="left: 120px; top: 60px; width: 22px; height: 56px; border-radius: 11px"></div>
        <div class="g" style="left: 109px; top: 28px; width: 44px; height: 44px; border-radius: 50%"></div>
        <div class="g" style="left: 46px; top: 106px; width: 170px; height: 96px; border-radius: 30px"></div>
        <div class="ic" style="left: 109px; top: 28px; width: 44px; height: 44px"><svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="{{shield}}"></path></svg></div>
      </div>
      <figcaption style="display: flex; flex-direction: column; gap: 3px">
        <span class="mono" style="font-size: 12px; color: #2E6BFF">≈ 160 ms · stretch</span>
        <span style="font-size: 14px; line-height: 20px; color: #2F3440">The body grows downward and the neck thins. A blend radius k = 18 px keeps them joined.</span>
      </figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
      <div class="stage">
        <div class="n" style="left: 119px; top: 58px; width: 24px; height: 36px; border-radius: 12px"></div>
        <div class="g" style="left: 109px; top: 28px; width: 44px; height: 44px; border-radius: 50%"></div>
        <div class="g" style="left: 22px; top: 86px; width: 218px; height: 176px; border-radius: 26px; padding: 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; gap: 10px">
            <span style="width: 26px; height: 26px; border-radius: 8px; background: #F2742B"></span>
            <span class="line" style="flex: 1"></span>
            <span style="width: 40px; height: 24px; border-radius: 999px; background: #1F9D57"></span>
          </div>
          <div style="height: 26px; border-radius: 999px; background: rgba(255,255,255,.6)"></div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
            <div style="height: 44px; border-radius: 12px; background: rgba(255,255,255,.6)"></div>
            <div style="height: 44px; border-radius: 12px; background: rgba(255,255,255,.6)"></div>
          </div>
        </div>
        <div class="ic" style="left: 109px; top: 28px; width: 44px; height: 44px"><svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="{{shield}}"></path></svg></div>
      </div>
      <figcaption style="display: flex; flex-direction: column; gap: 3px">
        <span class="mono" style="font-size: 12px; color: #2E6BFF">≈ 340 ms · settled</span>
        <span style="font-size: 14px; line-height: 20px; color: #2F3440">The neck rests at 24 px and the content fades in. Dismissing reverses the motion and the glass snaps back into the button.</span>
      </figcaption>
    </figure>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    return { shield: 'M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6zM9 12l2 2 4-4' };
  }
}
</script>
</body>
</html>
