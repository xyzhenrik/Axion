<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Axion — Picture in Picture</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.i{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.pip{background:rgba(255,255,255,.34);-webkit-backdrop-filter:blur(22px) saturate(190%) brightness(1.06);backdrop-filter:blur(22px) saturate(190%) brightness(1.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.4),inset 0 0 0 .5px rgba(255,255,255,.7),inset 12px 12px 22px -14px rgba(255,255,255,1),0 30px 80px rgba(12,20,40,.38),0 6px 18px rgba(12,20,40,.2)}
.gd{background:rgba(20,22,28,.36);-webkit-backdrop-filter:blur(18px) saturate(170%) brightness(.9);backdrop-filter:blur(18px) saturate(170%) brightness(.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.36),inset 0 0 0 .5px rgba(255,255,255,.22),inset 10px 10px 18px -12px rgba(255,255,255,.3)}
.cb{border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#FFFFFF}
.scene{position:absolute;overflow:hidden;background:linear-gradient(#0E2433 0%,#24506A 38%,#C9805E 66%,#F2C38A 74%,#1A3A4A 74.2%,#0B2230 100%)}
</style>
</helmet>
<div style="width: 1600px; height: 1000px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif">
  <div style="position: absolute; inset: 0">
    <dc-import name="Window" hint-size="1600px,1000px"></dc-import>
  </div>

  <section class="pip" aria-label="Picture in Picture: Low Tide" style="position: absolute; right: 24px; bottom: 24px; width: 460px; height: 268px; border-radius: 28px; padding: 6px; box-sizing: border-box">
    <div class="scene" style="position: relative; width: 100%; height: 100%; border-radius: 22px">
      <div style="position: absolute; left: 282px; top: 160px; width: 46px; height: 46px; border-radius: 50%; background: #FFE2A8"></div>
      <div style="position: absolute; left: 0; right: 0; top: 190px; bottom: 0; background: #0B2230"></div>
      <div style="position: absolute; left: 0; top: 120px; width: 180px; height: 140px; background: #08151D; clip-path: polygon(0 0, 30% 4%, 58% 22%, 78% 40%, 100% 72%, 100% 100%, 0 100%)"></div>
      <div style="position: absolute; left: 66px; top: 74px; width: 14px; height: 52px; background: #E9E2D4"></div>
      <div style="position: absolute; left: 64px; top: 66px; width: 18px; height: 10px; border-radius: 3px 3px 0 0; background: #FFE9A8; box-shadow: 0 0 22px 8px rgba(255,226,150,.55)"></div>
      <div style="position: absolute; inset: 0; background: rgba(0,0,0,.18)"></div>

      <div style="position: absolute; left: 10px; top: 10px; display: flex; gap: 6px">
        <button class="gd cb" aria-label="Close Picture in Picture" style="width: 34px; height: 34px"><svg class="i" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" style="stroke-width: 2.2"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"></path></svg></button>
        <button class="gd cb" aria-label="Back to tab" style="width: 34px; height: 34px"><svg class="i" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M4.5 5h15A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5v-11A1.5 1.5 0 0 1 4.5 5zM15 9H9v6M9 9l6 6"></path></svg></button>
      </div>
      <button class="gd cb" aria-label="Mute" style="position: absolute; right: 10px; top: 10px; width: 34px; height: 34px"><svg class="i" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M4 9.5h3.5L12.5 5.5v13l-5-4H4zM16 9a4.5 4.5 0 0 1 0 6"></path></svg></button>

      <div style="position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); display: flex; justify-content: center; align-items: center; gap: 18px">
        <button class="gd cb" aria-label="Back 10 seconds" style="width: 44px; height: 44px"><svg class="i" viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"></path></svg></button>
        <button class="gd cb" aria-label="Pause" style="width: 58px; height: 58px"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"></path></svg></button>
        <button class="gd cb" aria-label="Forward 10 seconds" style="width: 44px; height: 44px"><svg class="i" viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4.5h-4.5"></path></svg></button>
      </div>

      <div style="position: absolute; left: 14px; right: 14px; bottom: 12px; display: flex; align-items: center; gap: 10px; color: #FFFFFF; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums">
        <span>12:48</span>
        <div style="flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.3)"><div style="width: 47.4%; height: 4px; border-radius: 2px; background: #FFFFFF"></div></div>
        <span>−14:12</span>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
