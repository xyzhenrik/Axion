name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# A newer push to the same branch / PR makes the running check obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The default runner has ~14 GB free; CEF (1.5 GB unpacked, plus its 330 MB archive) and a
      # debug + clippy build of the workspace need more. These toolchains are not used here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # cmake/ninja/clang: the CEF C++ wrapper (cef-dll-sys); libtss2-dev + pkg-config: the TPM
      # backend (default feature); wayland/xkbcommon/x11 headers: windowing.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libclang-dev pkg-config libtss2-dev \
            libwayland-dev libxkbcommon-dev libx11-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # cef-dll-sys downloads ~330 MB (1.5 GB unpacked) of CEF binaries into third_party/cef
      # (see .cargo/config.toml) on first build. Keyed by the CEF version, not by Cargo.lock,
      # so an ordinary dependency update does not download it again.
      - name: CEF version
        id: cef
        run: echo "version=$(grep -A1 '^name = "cef-dll-sys"' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')" >>"$GITHUB_OUTPUT"

      - name: Cache CEF
        uses: actions/cache@v4
        with:
          path: third_party/cef
          key: cef-${{ runner.os }}-${{ steps.cef.outputs.version }}

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # The release scripts must at least parse.
      - name: Shell scripts
        run: |
          for f in tools/package.sh tools/install.sh tools/install-desktop.sh tools/package/AppRun; do bash -n "$f"; done
