name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # cef-dll-sys downloads ~1 GB of CEF binaries into third_party/cef on first build.
      - name: Cache CEF
        uses: actions/cache@v4
        with:
          path: third_party/cef
          key: cef-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
