"Kill switch: if a connection goes down, its requests are blocked and a page explains it. They are never sent directly. Leak protection keeps WebRTC from using your real address, turns off DNS prefetching and secure DNS, and stops Chromium's background services. QUIC and name-resolution settings apply after a restart. Addresses on this computer (localhost, 192.168.x.x) are never sent through a connection." = "Coupure de sécurité : si une connexion tombe, ses requêtes sont bloquées et une page l’explique. Elles ne sont jamais envoyées directement. La protection contre les fuites empêche WebRTC d’utiliser votre véritable adresse, désactive le préchargement DNS et le DNS sécurisé, et arrête les services en arrière-plan de Chromium. QUIC et les réglages de résolution de noms s’appliquent après un redémarrage. Les adresses de cet ordinateur (localhost, 192.168.x.x) ne passent jamais par une connexion."
