# crates/axion-app/src/update.rs
"Axion can't write to {path}, so it can't replace this installation." = "Axion ne peut pas écrire dans {path} : il ne peut donc pas remplacer cette installation."
"Axion downloads {file} ({size}) and replaces {path}. The current version is kept next to it as {backup}." = "Axion télécharge {file} ({size}) et remplace {path}. La version actuelle est conservée à côté sous le nom {backup}."
"Axion downloads {file} ({size}) and unpacks it next to {path}. {path} itself is replaced only when you restart Axion; the current version is kept as a backup." = "Axion télécharge {file} ({size}) et le décompresse à côté de {path}. {path} lui-même n’est remplacé qu’au redémarrage d’Axion ; la version actuelle est conservée en sauvegarde."
"Building Axion… this takes a while." = "Compilation d’Axion… cela peut prendre un moment."
"Changes to tracked files stop the update; untracked files are fine. Local commits are never merged, rebased or reset, and nothing is forced." = "Les modifications des fichiers suivis arrêtent la mise à jour ; les fichiers non suivis ne posent pas de problème. Les commits locaux ne sont jamais fusionnés, rebasés ni réinitialisés, et rien n’est forcé."
"Checking the working tree…" = "Vérification de l’arbre de travail…"
"Commit, stash or revert these changes (see “git status”), then try again. Untracked files do not matter." = "Validez, mettez de côté ou annulez ces modifications (voir « git status »), puis réessayez. Les fichiers non suivis n’ont pas d’importance."
"Couldn't reach the update server. Check your connection and try again." = "Impossible de joindre le serveur de mises à jour. Vérifiez votre connexion et réessayez."
"Downloading… {done}" = "Téléchargement… {done}"
"Downloading… {done} of {total}" = "Téléchargement… {done} sur {total}"
"Fetching changes…" = "Récupération des modifications…"
"In {path}, Axion runs “git fetch”, then “git pull --ff-only” if there is something new, and “cargo build -p axion-app --release”. This can take several minutes." = "Dans {path}, Axion exécute « git fetch », puis « git pull --ff-only » s’il y a du nouveau, et « cargo build -p axion-app --release ». Cela peut prendre plusieurs minutes."
"No update source is set yet." = "Aucune source de mise à jour n’est encore définie."
"Nothing was changed." = "Rien n’a été modifié."
"Pulling changes…" = "Application des modifications…"
"Push your commits or reset the branch yourself; Axion never rewrites your history." = "Envoyez vos commits ou réinitialisez la branche vous-même ; Axion ne réécrit jamais votre historique."
"Rebase or merge the branch yourself (git pull --rebase), then try again. Axion never does it for you." = "Rebasez ou fusionnez la branche vous-même (git pull --rebase), puis réessayez. Axion ne le fait jamais à votre place."
"Restart Axion to start using it." = "Redémarrez Axion pour l’utiliser."
"Starting…" = "Démarrage…"
"The checkout has diverged from {upstream}: {ahead} local and {behind} new commit(s)." = "La copie de travail a divergé de {upstream} : {ahead} commit(s) local(aux) et {behind} nouveau(x) commit(s)."
"The checkout has uncommitted changes to tracked files, so Axion left it alone." = "La copie de travail contient des modifications non validées dans des fichiers suivis : Axion ne l’a pas touchée."
"The checkout is {ahead} commit(s) ahead of {upstream} and has nothing new to take from it." = "La copie de travail a {ahead} commit(s) d’avance sur {upstream} et n’a rien de nouveau à récupérer."
"The checkout isn't on a branch that follows a remote branch." = "La copie de travail n’est pas sur une branche qui suit une branche distante."
"The checkout's remote ({remote}) isn't the configured repository ({repository})." = "Le dépôt distant de la copie de travail ({remote}) n’est pas le dépôt configuré ({repository})."
"The current version was left as it was." = "La version actuelle a été laissée telle quelle."
"The download doesn't match its published checksum, so it was discarded." = "Le téléchargement ne correspond pas à sa somme de contrôle publiée : il a été supprimé."
"The download is checked against the release's published checksum first." = "Le téléchargement est d’abord vérifié par rapport à la somme de contrôle publiée de la version."
"The download is larger than the allowed size." = "Le téléchargement est plus volumineux que la taille autorisée."
"The download matched its published checksum." = "Le téléchargement correspond à sa somme de contrôle publiée."
"The downloaded archive was rejected: {why}" = "L’archive téléchargée a été rejetée : {why}"
"The new version is unpacked and checked. It replaces the current one when Axion restarts; the current one is kept as a backup." = "La nouvelle version est décompressée et vérifiée. Elle remplace l’actuelle au redémarrage d’Axion ; l’actuelle est conservée en sauvegarde."
"The source was updated and built. Restart Axion to finish the update: until then this window still runs the old build." = "Les sources ont été mises à jour et compilées. Redémarrez Axion pour terminer la mise à jour : jusque-là, cette fenêtre utilise encore l’ancienne version."
"The source was updated, but building it failed. The previous build is still in place." = "Les sources ont été mises à jour, mais la compilation a échoué. La version précédente est toujours en place."
"The update server sent something Axion doesn't understand." = "Le serveur de mises à jour a envoyé une réponse qu’Axion ne comprend pas."
"This installation is managed elsewhere or needs permissions. Download the new version from the release page." = "Cette installation est gérée ailleurs ou nécessite des droits. Téléchargez la nouvelle version depuis la page des versions."
"This release has no download for this installation." = "Cette version n’a pas de téléchargement pour cette installation."
"This release publishes no checksum, so the download can't be verified." = "Cette version ne publie aucune somme de contrôle : le téléchargement ne peut pas être vérifié."
"This release publishes no checksum, so the download could not be verified." = "Cette version ne publie aucune somme de contrôle : le téléchargement n’a pas pu être vérifié."
"Unpacking the new version…" = "Décompression de la nouvelle version…"
"Update Axion to {version}?" = "Mettre Axion à jour vers {version} ?"
"Update failed" = "Échec de la mise à jour"
"Update from Git?" = "Mettre à jour depuis Git ?"
"Updated to {version}" = "Mis à jour vers {version}"
"Updating Axion…" = "Mise à jour d’Axion…"
"Updating from Git…" = "Mise à jour depuis Git…"
"Verifying the download…" = "Vérification du téléchargement…"
"size unknown" = "taille inconnue"
"the AppImage" = "l’AppImage"
"the tarball" = "l’archive tar"
"…and {count} more" = "…et {count} de plus"

