# crates/axion-app/src/update.rs
"Axion can't write to {path}, so it can't replace this installation." = "Axion 无法写入 {path}，因此无法替换此安装。"
"Axion downloads {file} ({size}) and replaces {path}. The current version is kept next to it as {backup}." = "Axion 将下载 {file}（{size}）并替换 {path}。当前版本将以 {backup} 的名称保留在旁边。"
"Axion downloads {file} ({size}) and unpacks it next to {path}. {path} itself is replaced only when you restart Axion; the current version is kept as a backup." = "Axion 将下载 {file}（{size}）并解压到 {path} 旁边。{path} 本身仅在您重启 Axion 时才会被替换；当前版本将作为备份保留。"
"Building Axion… this takes a while." = "正在构建 Axion…这需要一些时间。"
"Changes to tracked files stop the update; untracked files are fine. Local commits are never merged, rebased or reset, and nothing is forced." = "已跟踪文件的更改会中止更新；未跟踪文件不受影响。本地提交绝不会被合并、变基或重置，也不会强制执行任何操作。"
"Checking the working tree…" = "正在检查工作区…"
"Commit, stash or revert these changes (see “git status”), then try again. Untracked files do not matter." = "请提交、暂存或撤销这些更改（参见“git status”），然后重试。未跟踪文件无影响。"
"Couldn't reach the update server. Check your connection and try again." = "无法连接更新服务器。请检查网络连接后重试。"
"Downloading… {done}" = "正在下载…{done}"
"Downloading… {done} of {total}" = "正在下载…{done} / {total}"
"Fetching changes…" = "正在获取更改…"
"In {path}, Axion runs “git fetch”, then “git pull --ff-only” if there is something new, and “cargo build -p axion-app --release”. This can take several minutes." = "在 {path} 中，Axion 将运行“git fetch”，若有新内容则运行“git pull --ff-only”，然后运行“cargo build -p axion-app --release”。这可能需要几分钟。"
"No update source is set yet." = "尚未设置更新源。"
"Nothing was changed." = "未做任何更改。"
"Pulling changes…" = "正在拉取更改…"
"Push your commits or reset the branch yourself; Axion never rewrites your history." = "请自行推送提交或重置分支；Axion 绝不会改写您的历史记录。"
"Rebase or merge the branch yourself (git pull --rebase), then try again. Axion never does it for you." = "请自行对分支进行变基或合并（git pull --rebase），然后重试。Axion 绝不会代您执行。"
"Restart Axion to start using it." = "重启 Axion 即可开始使用。"
"Starting…" = "正在启动…"
"The checkout has diverged from {upstream}: {ahead} local and {behind} new commit(s)." = "检出版本已与 {upstream} 分叉：本地 {ahead} 个提交，新提交 {behind} 个。"
"The checkout has uncommitted changes to tracked files, so Axion left it alone." = "检出版本中已跟踪文件有未提交的更改，因此 Axion 未做处理。"
"The checkout is {ahead} commit(s) ahead of {upstream} and has nothing new to take from it." = "检出版本比 {upstream} 超前 {ahead} 个提交，且没有可获取的新内容。"
"The checkout isn't on a branch that follows a remote branch." = "检出版本不在跟踪远程分支的分支上。"
"The checkout's remote ({remote}) isn't the configured repository ({repository})." = "检出版本的远程（{remote}）与已配置的仓库（{repository}）不一致。"
"The current version was left as it was." = "当前版本保持不变。"
"The download doesn't match its published checksum, so it was discarded." = "下载内容与其发布的校验和不符，因此已被丢弃。"
"The download is checked against the release's published checksum first." = "下载内容将首先与该版本发布的校验和进行比对。"
"The download is larger than the allowed size." = "下载内容超过允许的大小。"
"The download matched its published checksum." = "下载内容与其发布的校验和一致。"
"The downloaded archive was rejected: {why}" = "已下载的压缩包被拒绝：{why}"
"The new version is unpacked and checked. It replaces the current one when Axion restarts; the current one is kept as a backup." = "新版本已解压并完成检查。Axion 重启时将替换当前版本；当前版本将作为备份保留。"
"The source was updated and built. Restart Axion to finish the update: until then this window still runs the old build." = "源代码已更新并构建完成。重启 Axion 以完成更新：在此之前，此窗口仍运行旧版本。"
"The source was updated, but building it failed. The previous build is still in place." = "源代码已更新，但构建失败。之前的构建仍保持不变。"
"The update server sent something Axion doesn't understand." = "更新服务器发送了 Axion 无法理解的内容。"
"This installation is managed elsewhere or needs permissions. Download the new version from the release page." = "此安装由其他方式管理或需要权限。请从发布页面下载新版本。"
"This release has no download for this installation." = "此版本没有适用于此安装的下载。"
"This release publishes no checksum, so the download can't be verified." = "此版本未发布校验和，因此无法验证下载内容。"
"This release publishes no checksum, so the download could not be verified." = "此版本未发布校验和，因此无法验证下载内容。"
"Unpacking the new version…" = "正在解压新版本…"
