# crates/axion-app/src/update.rs
"Axion can't write to {path}, so it can't replace this installation." = "Axion {path} konumuna yazamıyor, bu yüzden bu kurulumu değiştiremez."
"Axion downloads {file} ({size}) and replaces {path}. The current version is kept next to it as {backup}." = "Axion {file} ({size}) dosyasını indirir ve {path} konumunun yerini alır. Mevcut sürüm yanında {backup} olarak saklanır."
"Axion downloads {file} ({size}) and unpacks it next to {path}. {path} itself is replaced only when you restart Axion; the current version is kept as a backup." = "Axion {file} ({size}) dosyasını indirir ve {path} yanına açar. {path} yalnızca Axion'u yeniden başlattığınızda değiştirilir; mevcut sürüm yedek olarak saklanır."
"Building Axion… this takes a while." = "Axion derleniyor… bu biraz zaman alır."
"Changes to tracked files stop the update; untracked files are fine. Local commits are never merged, rebased or reset, and nothing is forced." = "İzlenen dosyalardaki değişiklikler güncellemeyi durdurur; izlenmeyen dosyalar sorun değildir. Yerel işlemeler hiçbir zaman birleştirilmez, rebase edilmez veya sıfırlanmaz ve hiçbir şey zorlanmaz."
"Checking the working tree…" = "Çalışma ağacı denetleniyor…"
"Commit, stash or revert these changes (see “git status”), then try again. Untracked files do not matter." = "Bu değişiklikleri işleyin, saklayın veya geri alın (“git status” bölümüne bakın), sonra yeniden deneyin. İzlenmeyen dosyalar önemli değildir."
"Couldn't reach the update server. Check your connection and try again." = "Güncelleme sunucusuna ulaşılamadı. Bağlantınızı denetleyip yeniden deneyin."
"Downloading… {done}" = "İndiriliyor… {done}"
"Downloading… {done} of {total}" = "İndiriliyor… {total} içinden {done}"
"Fetching changes…" = "Değişiklikler alınıyor…"
"In {path}, Axion runs “git fetch”, then “git pull --ff-only” if there is something new, and “cargo build -p axion-app --release”. This can take several minutes." = "{path} içinde Axion “git fetch” çalıştırır, yeni bir şey varsa “git pull --ff-only”, ardından “cargo build -p axion-app --release” çalıştırır. Birkaç dakika sürebilir."
"No update source is set yet." = "Henüz güncelleme kaynağı ayarlanmadı."
"Nothing was changed." = "Hiçbir şey değiştirilmedi."
"Pulling changes…" = "Değişiklikler çekiliyor…"
"Push your commits or reset the branch yourself; Axion never rewrites your history." = "İşlemelerinizi gönderin veya dalı kendiniz sıfırlayın; Axion geçmişinizi hiçbir zaman yeniden yazmaz."
"Rebase or merge the branch yourself (git pull --rebase), then try again. Axion never does it for you." = "Dalı kendiniz rebase edin veya birleştirin (git pull --rebase), sonra yeniden deneyin. Axion bunu sizin yerinize hiçbir zaman yapmaz."
"Restart Axion to start using it." = "Kullanmaya başlamak için Axion'u yeniden başlatın."
"Starting…" = "Başlatılıyor…"
"The checkout has diverged from {upstream}: {ahead} local and {behind} new commit(s)." = "Kopya {upstream} ile ayrıştı: {ahead} yerel ve {behind} yeni işleme."
"The checkout has uncommitted changes to tracked files, so Axion left it alone." = "Kopyada izlenen dosyalarda işlenmemiş değişiklikler var, bu yüzden Axion ona dokunmadı."
"The checkout is {ahead} commit(s) ahead of {upstream} and has nothing new to take from it." = "Kopya {upstream} önünde {ahead} işleme sahip ve ondan alınacak yeni bir şey yok."
"The checkout isn't on a branch that follows a remote branch." = "Kopya, uzak bir dalı izleyen bir dalda değil."
"The checkout's remote ({remote}) isn't the configured repository ({repository})." = "Kopyanın uzak deposu ({remote}) ayarlanmış depo ({repository}) değil."
"The current version was left as it was." = "Mevcut sürüm olduğu gibi bırakıldı."
"The download doesn't match its published checksum, so it was discarded." = "İndirme, yayımlanmış sağlama toplamıyla eşleşmiyor; bu yüzden atıldı."
"The download is checked against the release's published checksum first." = "İndirme önce sürümün yayımlanmış sağlama toplamına göre denetlenir."
"The download is larger than the allowed size." = "İndirme izin verilen boyuttan büyük."
"The download matched its published checksum." = "İndirme yayımlanmış sağlama toplamıyla eşleşti."
"The downloaded archive was rejected: {why}" = "İndirilen arşiv reddedildi: {why}"
"The new version is unpacked and checked. It replaces the current one when Axion restarts; the current one is kept as a backup." = "Yeni sürüm açıldı ve denetlendi. Axion yeniden başlatıldığında mevcut sürümün yerini alır; mevcut sürüm yedek olarak saklanır."
"The source was updated and built. Restart Axion to finish the update: until then this window still runs the old build." = "Kaynak güncellendi ve derlendi. Güncellemeyi tamamlamak için Axion'u yeniden başlatın: o zamana kadar bu pencere eski derlemeyle çalışmaya devam eder."
"The source was updated, but building it failed. The previous build is still in place." = "Kaynak güncellendi, ancak derleme başarısız oldu. Önceki derleme yerinde duruyor."
"The update server sent something Axion doesn't understand." = "Güncelleme sunucusu Axion'un anlamadığı bir şey gönderdi."
"This installation is managed elsewhere or needs permissions. Download the new version from the release page." = "Bu kurulum başka yerden yönetiliyor veya izin gerektiriyor. Yeni sürümü sürüm sayfasından indirin."
"This release has no download for this installation." = "Bu sürümde bu kurulum için indirme yok."
"This release publishes no checksum, so the download can't be verified." = "Bu sürüm sağlama toplamı yayımlamıyor; bu yüzden indirme doğrulanamaz."
"This release publishes no checksum, so the download could not be verified." = "Bu sürüm sağlama toplamı yayımlamıyor; bu yüzden indirme doğrulanamadı."
"Unpacking the new version…" = "Yeni sürüm açılıyor…"
"Update Axion to {version}?" = "Axion {version} sürümüne güncellensin mi?"
"Update failed" = "Güncelleme başarısız"
"Update from Git?" = "Git'ten güncellensin mi?"
"Updated to {version}" = "{version} sürümüne güncellendi"
