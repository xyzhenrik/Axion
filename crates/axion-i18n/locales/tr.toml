"Config read. Keys will be stored encrypted with this device's key." = "Yapılandırma okundu. Anahtarlar bu cihazın anahtarıyla şifreli saklanacak."
"The password is stored encrypted with this device's key, not in the settings file. Names are always resolved by the proxy, never on this computer." = "Parola, ayarlar dosyasında değil, bu cihazın anahtarıyla şifreli saklanır. Adlar her zaman proxy tarafından çözülür, bu bilgisayarda asla."
"The private key and any preshared keys are stored encrypted with this device's key. Scripts in the config (PostUp and the like) are never run." = "Özel anahtar ve varsa önceden paylaşılan anahtarlar bu cihazın anahtarıyla şifreli saklanır. Yapılandırmadaki komut dosyaları (PostUp ve benzeri) hiçbir zaman çalıştırılmaz."
"These connections still keep a password or key in your password vault from an older version. Unlock Passwords (Settings › Passwords) once and they connect; the secrets then move out of the vault." = "Bu bağlantılar, eski bir sürümden kalan parolayı veya anahtarı hâlâ parola kasanızda tutuyor. Parolaların kilidini bir kez açın (Ayarlar › Parolalar); bağlanırlar ve gizli bilgiler kasadan çıkar."

