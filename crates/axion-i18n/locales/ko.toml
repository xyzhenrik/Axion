"Kill switch: if a connection goes down, its requests are blocked and a page explains it. They are never sent directly. Leak protection keeps WebRTC from using your real address, turns off DNS prefetching and secure DNS, and stops Chromium's background services. QUIC and name-resolution settings apply after a restart. Addresses on this computer (localhost, 192.168.x.x) are never sent through a connection." = "킬 스위치: 연결이 끊기면 해당 요청은 차단되고 페이지에 이유가 표시됩니다. 요청이 직접 전송되는 일은 결코 없습니다. 누출 방지는 WebRTC가 실제 주소를 사용하지 못하도록 하고, DNS 미리 가져오기와 보안 DNS를 끄며, Chromium의 백그라운드 서비스를 중지합니다. QUIC 및 이름 확인 설정은 재시작 후 적용됩니다. 이 컴퓨터의 주소(localhost, 192.168.x.x)는 결코 연결을 통해 전송되지 않습니다."
