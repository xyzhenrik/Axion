# crates/axion-app/src/update.rs
"Axion can't write to {path}, so it can't replace this installation." = "Axion이 {path}에 쓸 수 없어 이 설치를 교체할 수 없습니다."
"Axion downloads {file} ({size}) and replaces {path}. The current version is kept next to it as {backup}." = "Axion이 {file}({size})을 다운로드하고 {path}를 교체합니다. 현재 버전은 {backup}으로 옆에 보관됩니다."
"Axion downloads {file} ({size}) and unpacks it next to {path}. {path} itself is replaced only when you restart Axion; the current version is kept as a backup." = "Axion이 {file}({size})을 다운로드하여 {path} 옆에 압축을 풉니다. {path}는 Axion을 다시 시작할 때만 교체되며, 현재 버전은 백업으로 보관됩니다."
"Building Axion… this takes a while." = "Axion 빌드 중… 시간이 조금 걸립니다."
"Changes to tracked files stop the update; untracked files are fine. Local commits are never merged, rebased or reset, and nothing is forced." = "추적 중인 파일의 변경 사항은 업데이트를 중단시킵니다. 추적되지 않는 파일은 괜찮습니다. 로컬 커밋은 병합, 리베이스 또는 초기화되지 않으며, 강제로 처리되지 않습니다."
"Checking the working tree…" = "작업 트리 확인 중…"
"Commit, stash or revert these changes (see “git status”), then try again. Untracked files do not matter." = "이 변경 사항을 커밋, 스태시 또는 되돌린 후(“git status” 참조) 다시 시도하세요. 추적되지 않는 파일은 상관없습니다."
"Couldn't reach the update server. Check your connection and try again." = "업데이트 서버에 연결할 수 없습니다. 연결을 확인하고 다시 시도하세요."
"Downloading… {done}" = "다운로드 중… {done}"
"Downloading… {done} of {total}" = "다운로드 중… {total} 중 {done}"
"Fetching changes…" = "변경 사항 가져오는 중…"
"In {path}, Axion runs “git fetch”, then “git pull --ff-only” if there is something new, and “cargo build -p axion-app --release”. This can take several minutes." = "{path}에서 Axion은 “git fetch”를 실행하고, 새 항목이 있으면 “git pull --ff-only”를, 그다음 “cargo build -p axion-app --release”를 실행합니다. 몇 분 걸릴 수 있습니다."
"No update source is set yet." = "아직 업데이트 소스가 설정되지 않았습니다."
"Nothing was changed." = "아무것도 변경되지 않았습니다."
"Pulling changes…" = "변경 사항 가져오는 중…"
"Push your commits or reset the branch yourself; Axion never rewrites your history." = "커밋을 푸시하거나 브랜치를 직접 초기화하세요. Axion은 기록을 결코 다시 쓰지 않습니다."
"Rebase or merge the branch yourself (git pull --rebase), then try again. Axion never does it for you." = "브랜치를 직접 리베이스하거나 병합(git pull --rebase)한 후 다시 시도하세요. Axion은 이를 대신하지 않습니다."
"Restart Axion to start using it." = "사용하려면 Axion을 다시 시작하세요."
"Starting…" = "시작 중…"
"The checkout has diverged from {upstream}: {ahead} local and {behind} new commit(s)." = "체크아웃이 {upstream}과 달라졌습니다: 로컬 커밋 {ahead}개, 새 커밋 {behind}개."
"The checkout has uncommitted changes to tracked files, so Axion left it alone." = "체크아웃에 추적 중인 파일의 커밋되지 않은 변경 사항이 있어, Axion이 건드리지 않았습니다."
"The checkout is {ahead} commit(s) ahead of {upstream} and has nothing new to take from it." = "체크아웃이 {upstream}보다 커밋 {ahead}개 앞서 있으며 가져올 새 항목이 없습니다."
"The checkout isn't on a branch that follows a remote branch." = "체크아웃이 원격 브랜치를 따르는 브랜치에 있지 않습니다."
"The checkout's remote ({remote}) isn't the configured repository ({repository})." = "체크아웃의 원격({remote})이 설정된 저장소({repository})가 아닙니다."
"The current version was left as it was." = "현재 버전은 그대로 두었습니다."
"The download doesn't match its published checksum, so it was discarded." = "다운로드 파일이 게시된 체크섬과 일치하지 않아 삭제되었습니다."
"The download is checked against the release's published checksum first." = "다운로드는 먼저 릴리스에 게시된 체크섬과 대조됩니다."
"The download is larger than the allowed size." = "다운로드 파일이 허용 크기보다 큽니다."
"The download matched its published checksum." = "다운로드 파일이 게시된 체크섬과 일치했습니다."
"The downloaded archive was rejected: {why}" = "다운로드한 압축 파일이 거부되었습니다: {why}"
"The new version is unpacked and checked. It replaces the current one when Axion restarts; the current one is kept as a backup." = "새 버전의 압축을 풀고 확인했습니다. Axion을 다시 시작하면 현재 버전을 대체하며, 현재 버전은 백업으로 보관됩니다."
"The source was updated and built. Restart Axion to finish the update: until then this window still runs the old build." = "소스가 업데이트되고 빌드되었습니다. 업데이트를 마치려면 Axion을 다시 시작하세요. 그때까지 이 창은 이전 빌드를 계속 실행합니다."
"The source was updated, but building it failed. The previous build is still in place." = "소스는 업데이트되었지만 빌드에 실패했습니다. 이전 빌드가 그대로 남아 있습니다."
"The update server sent something Axion doesn't understand." = "업데이트 서버가 Axion이 이해할 수 없는 응답을 보냈습니다."
"This installation is managed elsewhere or needs permissions. Download the new version from the release page." = "이 설치는 다른 곳에서 관리되거나 권한이 필요합니다. 릴리스 페이지에서 새 버전을 다운로드하세요."
"This release has no download for this installation." = "이 릴리스에는 이 설치용 다운로드가 없습니다."
"This release publishes no checksum, so the download can't be verified." = "이 릴리스는 체크섬을 게시하지 않아 다운로드를 확인할 수 없습니다."
"This release publishes no checksum, so the download could not be verified." = "이 릴리스는 체크섬을 게시하지 않아 다운로드를 확인할 수 없었습니다."
"Unpacking the new version…" = "새 버전 압축 푸는 중…"
"Update Axion to {version}?" = "Axion을 {version}으로 업데이트할까요?"
"Update failed" = "업데이트 실패"
"Update from Git?" = "Git에서 업데이트할까요?"
"Updated to {version}" = "{version}으로 업데이트됨"
