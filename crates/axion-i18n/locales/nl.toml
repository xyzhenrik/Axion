# crates/axion-app/src/update.rs
"Axion can't write to {path}, so it can't replace this installation." = "Axion kan niet naar {path} schrijven, dus het kan deze installatie niet vervangen."
"Axion downloads {file} ({size}) and replaces {path}. The current version is kept next to it as {backup}." = "Axion downloadt {file} ({size}) en vervangt {path}. De huidige versie wordt ernaast bewaard als {backup}."
"Axion downloads {file} ({size}) and unpacks it next to {path}. {path} itself is replaced only when you restart Axion; the current version is kept as a backup." = "Axion downloadt {file} ({size}) en pakt het uit naast {path}. {path} zelf wordt pas vervangen wanneer je Axion opnieuw start; de huidige versie wordt als back-up bewaard."
"Building Axion… this takes a while." = "Axion bouwen… dit duurt even."
"Changes to tracked files stop the update; untracked files are fine. Local commits are never merged, rebased or reset, and nothing is forced." = "Wijzigingen in gevolgde bestanden stoppen de update; niet-gevolgde bestanden zijn prima. Lokale commits worden nooit samengevoegd, gerebased of teruggezet, en er wordt niets geforceerd."
"Checking the working tree…" = "Werkmap controleren…"
"Commit, stash or revert these changes (see “git status”), then try again. Untracked files do not matter." = "Leg deze wijzigingen vast, stash ze of draai ze terug (zie “git status”) en probeer het opnieuw. Niet-gevolgde bestanden doen er niet toe."
"Couldn't reach the update server. Check your connection and try again." = "De updateserver kon niet worden bereikt. Controleer je verbinding en probeer het opnieuw."
"Downloading… {done}" = "Downloaden… {done}"
"Downloading… {done} of {total}" = "Downloaden… {done} van {total}"
"Fetching changes…" = "Wijzigingen ophalen…"
"In {path}, Axion runs “git fetch”, then “git pull --ff-only” if there is something new, and “cargo build -p axion-app --release”. This can take several minutes." = "In {path} voert Axion “git fetch” uit, daarna “git pull --ff-only” als er iets nieuws is, en “cargo build -p axion-app --release”. Dit kan enkele minuten duren."
"No update source is set yet." = "Er is nog geen updatebron ingesteld."
"Nothing was changed." = "Er is niets gewijzigd."
"Pulling changes…" = "Wijzigingen ophalen…"
"Push your commits or reset the branch yourself; Axion never rewrites your history." = "Push je commits of zet de branch zelf terug; Axion herschrijft je geschiedenis nooit."
"Rebase or merge the branch yourself (git pull --rebase), then try again. Axion never does it for you." = "Rebase of voeg de branch zelf samen (git pull --rebase) en probeer het opnieuw. Axion doet dit nooit voor je."
"Restart Axion to start using it." = "Start Axion opnieuw om het te gaan gebruiken."
"Starting…" = "Starten…"
"The checkout has diverged from {upstream}: {ahead} local and {behind} new commit(s)." = "De checkout is uit de pas gelopen met {upstream}: {ahead} lokaal en {behind} nieuwe commit(s)."
"The checkout has uncommitted changes to tracked files, so Axion left it alone." = "De checkout heeft niet-vastgelegde wijzigingen in gevolgde bestanden, dus Axion heeft hem ongemoeid gelaten."
"The checkout is {ahead} commit(s) ahead of {upstream} and has nothing new to take from it." = "De checkout loopt {ahead} commit(s) voor op {upstream} en heeft niets nieuws om op te halen."
"The checkout isn't on a branch that follows a remote branch." = "De checkout staat niet op een branch die een remote-branch volgt."
"The checkout's remote ({remote}) isn't the configured repository ({repository})." = "De remote van de checkout ({remote}) is niet de ingestelde repository ({repository})."
"The current version was left as it was." = "De huidige versie is ongewijzigd gelaten."
"The download doesn't match its published checksum, so it was discarded." = "De download komt niet overeen met de gepubliceerde checksum en is daarom verwijderd."
"The download is checked against the release's published checksum first." = "De download wordt eerst gecontroleerd tegen de gepubliceerde checksum van de release."
"The download is larger than the allowed size." = "De download is groter dan de toegestane grootte."
"The download matched its published checksum." = "De download komt overeen met de gepubliceerde checksum."
"The downloaded archive was rejected: {why}" = "Het gedownloade archief is geweigerd: {why}"
"The new version is unpacked and checked. It replaces the current one when Axion restarts; the current one is kept as a backup." = "De nieuwe versie is uitgepakt en gecontroleerd. Hij vervangt de huidige wanneer Axion opnieuw start; de huidige wordt als back-up bewaard."
"The source was updated and built. Restart Axion to finish the update: until then this window still runs the old build." = "De bron is bijgewerkt en gebouwd. Start Axion opnieuw om de update af te ronden: tot die tijd draait dit venster nog de oude build."
"The source was updated, but building it failed. The previous build is still in place." = "De bron is bijgewerkt, maar het bouwen is mislukt. De vorige build staat nog op zijn plaats."
"The update server sent something Axion doesn't understand." = "De updateserver heeft iets gestuurd dat Axion niet begrijpt."
"This installation is managed elsewhere or needs permissions. Download the new version from the release page." = "Deze installatie wordt elders beheerd of heeft rechten nodig. Download de nieuwe versie van de releasepagina."
"This release has no download for this installation." = "Deze release heeft geen download voor deze installatie."
"This release publishes no checksum, so the download can't be verified." = "Deze release publiceert geen checksum, dus de download kan niet worden geverifieerd."
"This release publishes no checksum, so the download could not be verified." = "Deze release publiceert geen checksum, dus de download kon niet worden geverifieerd."
"Unpacking the new version…" = "De nieuwe versie uitpakken…"
"Update Axion to {version}?" = "Axion bijwerken naar {version}?"
"Update failed" = "Update mislukt"
"Update from Git?" = "Bijwerken vanuit Git?"
"Updated to {version}" = "Bijgewerkt naar {version}"
"Updating Axion…" = "Axion bijwerken…"
"Updating from Git…" = "Bijwerken vanuit Git…"
"Verifying the download…" = "De download verifiëren…"
"size unknown" = "grootte onbekend"
"the AppImage" = "de AppImage"
"the tarball" = "de tarball"
"…and {count} more" = "…en {count} meer"

