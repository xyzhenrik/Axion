"Kill switch: if a connection goes down, its requests are blocked and a page explains it. They are never sent directly. Leak protection keeps WebRTC from using your real address, turns off DNS prefetching and secure DNS, and stops Chromium's background services. QUIC and name-resolution settings apply after a restart. Addresses on this computer (localhost, 192.168.x.x) are never sent through a connection." = "Noodstop: als een verbinding wegvalt, worden de verzoeken ervan geblokkeerd en legt een pagina dat uit. Ze worden nooit rechtstreeks verstuurd. Lekbescherming voorkomt dat WebRTC je echte adres gebruikt, schakelt DNS-prefetch en beveiligde DNS uit en stopt de achtergrondservices van Chromium. QUIC- en naamomzettingsinstellingen gelden na een herstart. Adressen op deze computer (localhost, 192.168.x.x) worden nooit via een verbinding verstuurd."
