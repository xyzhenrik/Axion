# crates/axion-app/src/update.rs
"Axion can't write to {path}, so it can't replace this installation." = "Axion no puede escribir en {path}, así que no puede reemplazar esta instalación."
"Axion downloads {file} ({size}) and replaces {path}. The current version is kept next to it as {backup}." = "Axion descarga {file} ({size}) y reemplaza {path}. La versión actual se guarda junto a él como {backup}."
"Axion downloads {file} ({size}) and unpacks it next to {path}. {path} itself is replaced only when you restart Axion; the current version is kept as a backup." = "Axion descarga {file} ({size}) y lo descomprime junto a {path}. {path} solo se reemplaza al reiniciar Axion; la versión actual se guarda como copia de seguridad."
"Building Axion… this takes a while." = "Compilando Axion… esto tarda un poco."
"Changes to tracked files stop the update; untracked files are fine. Local commits are never merged, rebased or reset, and nothing is forced." = "Los cambios en archivos rastreados detienen la actualización; los archivos sin rastrear no importan. Los commits locales nunca se fusionan, se rebasan ni se restablecen, y nada se fuerza."
"Checking the working tree…" = "Comprobando el árbol de trabajo…"
"Commit, stash or revert these changes (see “git status”), then try again. Untracked files do not matter." = "Confirma, guarda en stash o revierte estos cambios (mira “git status”) y vuelve a intentarlo. Los archivos sin rastrear no importan."
"Couldn't reach the update server. Check your connection and try again." = "No se pudo contactar con el servidor de actualizaciones. Comprueba tu conexión e inténtalo de nuevo."
"Downloading… {done}" = "Descargando… {done}"
"Downloading… {done} of {total}" = "Descargando… {done} de {total}"
"Fetching changes…" = "Obteniendo cambios…"
"In {path}, Axion runs “git fetch”, then “git pull --ff-only” if there is something new, and “cargo build -p axion-app --release”. This can take several minutes." = "En {path}, Axion ejecuta “git fetch”, luego “git pull --ff-only” si hay algo nuevo, y “cargo build -p axion-app --release”. Puede tardar varios minutos."
"No update source is set yet." = "Todavía no hay origen de actualizaciones."
"Nothing was changed." = "No se cambió nada."
"Pulling changes…" = "Descargando cambios…"
"Push your commits or reset the branch yourself; Axion never rewrites your history." = "Sube tus commits o restablece la rama tú mismo; Axion nunca reescribe tu historial."
"Rebase or merge the branch yourself (git pull --rebase), then try again. Axion never does it for you." = "Rebasa o fusiona la rama tú mismo (git pull --rebase) y vuelve a intentarlo. Axion nunca lo hace por ti."
"Restart Axion to start using it." = "Reinicia Axion para empezar a usarlo."
"Starting…" = "Iniciando…"
"The checkout has diverged from {upstream}: {ahead} local and {behind} new commit(s)." = "La copia de trabajo ha divergido de {upstream}: {ahead} commit(s) local(es) y {behind} nuevo(s)."
"The checkout has uncommitted changes to tracked files, so Axion left it alone." = "La copia de trabajo tiene cambios sin confirmar en archivos rastreados, así que Axion no la ha tocado."
"The checkout is {ahead} commit(s) ahead of {upstream} and has nothing new to take from it." = "La copia de trabajo va {ahead} commit(s) por delante de {upstream} y no hay nada nuevo que tomar de ella."
"The checkout isn't on a branch that follows a remote branch." = "La copia de trabajo no está en una rama que siga a una rama remota."
"The checkout's remote ({remote}) isn't the configured repository ({repository})." = "El remoto de la copia de trabajo ({remote}) no es el repositorio configurado ({repository})."
"The current version was left as it was." = "La versión actual se ha dejado como estaba."
"The download doesn't match its published checksum, so it was discarded." = "La descarga no coincide con su suma de comprobación publicada, así que se ha descartado."
"The download is checked against the release's published checksum first." = "La descarga se comprueba primero con la suma de comprobación publicada de la versión."
"The download is larger than the allowed size." = "La descarga es más grande que el tamaño permitido."
"The download matched its published checksum." = "La descarga coincide con su suma de comprobación publicada."
"The downloaded archive was rejected: {why}" = "Se rechazó el archivo descargado: {why}"
"The new version is unpacked and checked. It replaces the current one when Axion restarts; the current one is kept as a backup." = "La nueva versión se ha descomprimido y comprobado. Reemplaza a la actual al reiniciar Axion; la actual se guarda como copia de seguridad."
"The source was updated and built. Restart Axion to finish the update: until then this window still runs the old build." = "El código se ha actualizado y compilado. Reinicia Axion para terminar la actualización: hasta entonces esta ventana sigue con la versión anterior."
"The source was updated, but building it failed. The previous build is still in place." = "El código se ha actualizado, pero la compilación ha fallado. La compilación anterior sigue en su sitio."
"The update server sent something Axion doesn't understand." = "El servidor de actualizaciones envió algo que Axion no entiende."
"This installation is managed elsewhere or needs permissions. Download the new version from the release page." = "Esta instalación la gestiona otro sistema o necesita permisos. Descarga la nueva versión desde la página de publicaciones."
"This release has no download for this installation." = "Esta versión no tiene descarga para esta instalación."
"This release publishes no checksum, so the download can't be verified." = "Esta versión no publica suma de comprobación, así que la descarga no se puede verificar."
"This release publishes no checksum, so the download could not be verified." = "Esta versión no publica suma de comprobación, así que la descarga no se pudo verificar."
"Unpacking the new version…" = "Descomprimiendo la nueva versión…"
"Update Axion to {version}?" = "¿Actualizar Axion a {version}?"
"Update failed" = "Error al actualizar"
"Update from Git?" = "¿Actualizar desde Git?"
"Updated to {version}" = "Actualizado a {version}"
"Updating Axion…" = "Actualizando Axion…"
"Updating from Git…" = "Actualizando desde Git…"
"Verifying the download…" = "Verificando la descarga…"
"size unknown" = "tamaño desconocido"
"the AppImage" = "el AppImage"
"the tarball" = "el tarball"
"…and {count} more" = "…y {count} más"

