"Kill switch: if a connection goes down, its requests are blocked and a page explains it. They are never sent directly. Leak protection keeps WebRTC from using your real address, turns off DNS prefetching and secure DNS, and stops Chromium's background services. QUIC and name-resolution settings apply after a restart. Addresses on this computer (localhost, 192.168.x.x) are never sent through a connection." = "Kill switch: se una connessione si interrompe, le sue richieste vengono bloccate e una pagina lo spiega. Non vengono mai inviate direttamente. La protezione dalle fughe impedisce a WebRTC di usare il tuo indirizzo reale, disattiva il prefetch DNS e il DNS sicuro e ferma i servizi in background di Chromium. Le impostazioni di QUIC e della risoluzione dei nomi si applicano dopo un riavvio. Gli indirizzi di questo computer (localhost, 192.168.x.x) non vengono mai inviati tramite una connessione."
