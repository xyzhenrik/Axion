# crates/axion-app/src/update.rs
"Axion can't write to {path}, so it can't replace this installation." = "Axion non può scrivere in {path}, quindi non può sostituire questa installazione."
"Axion downloads {file} ({size}) and replaces {path}. The current version is kept next to it as {backup}." = "Axion scarica {file} ({size}) e sostituisce {path}. La versione attuale viene conservata accanto come {backup}."
"Axion downloads {file} ({size}) and unpacks it next to {path}. {path} itself is replaced only when you restart Axion; the current version is kept as a backup." = "Axion scarica {file} ({size}) e lo decomprime accanto a {path}. {path} viene sostituito solo al riavvio di Axion; la versione attuale viene conservata come backup."
"Building Axion… this takes a while." = "Compilazione di Axion… può richiedere un po’ di tempo."
"Changes to tracked files stop the update; untracked files are fine. Local commits are never merged, rebased or reset, and nothing is forced." = "Le modifiche ai file tracciati bloccano l’aggiornamento; i file non tracciati vanno bene. I commit locali non vengono mai uniti, rebasati o ripristinati, e nulla viene forzato."
"Checking the working tree…" = "Verifica della working tree…"
"Commit, stash or revert these changes (see “git status”), then try again. Untracked files do not matter." = "Esegui commit, stash o annulla queste modifiche (vedi “git status”), poi riprova. I file non tracciati non contano."
"Couldn't reach the update server. Check your connection and try again." = "Impossibile contattare il server degli aggiornamenti. Controlla la connessione e riprova."
"Downloading… {done}" = "Download… {done}"
"Downloading… {done} of {total}" = "Download… {done} di {total}"
"Fetching changes…" = "Recupero delle modifiche…"
"In {path}, Axion runs “git fetch”, then “git pull --ff-only” if there is something new, and “cargo build -p axion-app --release”. This can take several minutes." = "In {path}, Axion esegue “git fetch”, poi “git pull --ff-only” se c’è qualcosa di nuovo, e “cargo build -p axion-app --release”. Può richiedere alcuni minuti."
"No update source is set yet." = "Nessuna fonte di aggiornamento impostata."
"Nothing was changed." = "Nulla è stato modificato."
"Pulling changes…" = "Scaricamento delle modifiche…"
"Push your commits or reset the branch yourself; Axion never rewrites your history." = "Esegui tu il push dei commit o ripristina il branch; Axion non riscrive mai la cronologia."
"Rebase or merge the branch yourself (git pull --rebase), then try again. Axion never does it for you." = "Esegui tu il rebase o il merge del branch (git pull --rebase), poi riprova. Axion non lo fa mai al tuo posto."
"Restart Axion to start using it." = "Riavvia Axion per iniziare a usarlo."
"Starting…" = "Avvio…"
"The checkout has diverged from {upstream}: {ahead} local and {behind} new commit(s)." = "Il checkout si è separato da {upstream}: {ahead} commit locali e {behind} nuovi commit."
"The checkout has uncommitted changes to tracked files, so Axion left it alone." = "Il checkout ha modifiche non committate ai file tracciati, quindi Axion non lo ha toccato."
"The checkout is {ahead} commit(s) ahead of {upstream} and has nothing new to take from it." = "Il checkout è avanti di {ahead} commit rispetto a {upstream} e non ha nulla di nuovo da prelevare."
"The checkout isn't on a branch that follows a remote branch." = "Il checkout non si trova su un branch che segue un branch remoto."
"The checkout's remote ({remote}) isn't the configured repository ({repository})." = "Il remote del checkout ({remote}) non corrisponde al repository configurato ({repository})."
"The current version was left as it was." = "La versione attuale è stata lasciata invariata."
"The download doesn't match its published checksum, so it was discarded." = "Il download non corrisponde al checksum pubblicato, quindi è stato scartato."
"The download is checked against the release's published checksum first." = "Il download viene prima verificato con il checksum pubblicato della release."
"The download is larger than the allowed size." = "Il download è più grande della dimensione consentita."
"The download matched its published checksum." = "Il download corrisponde al checksum pubblicato."
"The downloaded archive was rejected: {why}" = "L’archivio scaricato è stato rifiutato: {why}"
"The new version is unpacked and checked. It replaces the current one when Axion restarts; the current one is kept as a backup." = "La nuova versione è stata decompressa e verificata. Sostituisce quella attuale al riavvio di Axion; quella attuale viene conservata come backup."
"The source was updated and built. Restart Axion to finish the update: until then this window still runs the old build." = "Il sorgente è stato aggiornato e compilato. Riavvia Axion per completare l’aggiornamento: fino ad allora questa finestra usa ancora la versione precedente."
"The source was updated, but building it failed. The previous build is still in place." = "Il sorgente è stato aggiornato, ma la compilazione non è riuscita. La build precedente è ancora in uso."
"The update server sent something Axion doesn't understand." = "Il server degli aggiornamenti ha inviato qualcosa che Axion non riconosce."
"This installation is managed elsewhere or needs permissions. Download the new version from the release page." = "Questa installazione è gestita altrove o richiede permessi. Scarica la nuova versione dalla pagina delle release."
"This release has no download for this installation." = "Questa release non ha un download per questa installazione."
"This release publishes no checksum, so the download can't be verified." = "Questa release non pubblica alcun checksum, quindi il download non può essere verificato."
"This release publishes no checksum, so the download could not be verified." = "Questa release non pubblica alcun checksum, quindi il download non è stato verificato."
"Unpacking the new version…" = "Decompressione della nuova versione…"
"Update Axion to {version}?" = "Aggiornare Axion alla versione {version}?"
"Update failed" = "Aggiornamento non riuscito"
"Update from Git?" = "Aggiornare da Git?"
"Updated to {version}" = "Aggiornato alla versione {version}"
"Updating Axion…" = "Aggiornamento di Axion…"
"Updating from Git…" = "Aggiornamento da Git…"
"Verifying the download…" = "Verifica del download…"
"size unknown" = "dimensione sconosciuta"
"the AppImage" = "l’AppImage"
"the tarball" = "l’archivio tar"
"…and {count} more" = "…e altri {count}"

