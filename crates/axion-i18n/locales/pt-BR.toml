# crates/axion-app/src/update.rs
"Axion can't write to {path}, so it can't replace this installation." = "O Axion não pode gravar em {path}, então não consegue substituir esta instalação."
"Axion downloads {file} ({size}) and replaces {path}. The current version is kept next to it as {backup}." = "O Axion baixa {file} ({size}) e substitui {path}. A versão atual é mantida ao lado como {backup}."
"Axion downloads {file} ({size}) and unpacks it next to {path}. {path} itself is replaced only when you restart Axion; the current version is kept as a backup." = "O Axion baixa {file} ({size}) e o descompacta ao lado de {path}. O próprio {path} só é substituído quando você reiniciar o Axion; a versão atual é mantida como backup."
"Building Axion… this takes a while." = "Compilando o Axion… isso leva um tempo."
"Changes to tracked files stop the update; untracked files are fine. Local commits are never merged, rebased or reset, and nothing is forced." = "Alterações em arquivos rastreados interrompem a atualização; arquivos não rastreados não têm problema. Commits locais nunca são mesclados, rebaseados ou redefinidos, e nada é forçado."
"Checking the working tree…" = "Verificando a árvore de trabalho…"
"Commit, stash or revert these changes (see “git status”), then try again. Untracked files do not matter." = "Faça commit, guarde (stash) ou desfaça estas alterações (veja “git status”) e tente de novo. Arquivos não rastreados não importam."
"Couldn't reach the update server. Check your connection and try again." = "Não foi possível acessar o servidor de atualizações. Verifique sua conexão e tente novamente."
"Downloading… {done}" = "Baixando… {done}"
"Downloading… {done} of {total}" = "Baixando… {done} de {total}"
"Fetching changes…" = "Buscando alterações…"
"In {path}, Axion runs “git fetch”, then “git pull --ff-only” if there is something new, and “cargo build -p axion-app --release”. This can take several minutes." = "Em {path}, o Axion executa “git fetch”, depois “git pull --ff-only” se houver algo novo, e “cargo build -p axion-app --release”. Isso pode levar vários minutos."
"No update source is set yet." = "Nenhuma fonte de atualização definida ainda."
"Nothing was changed." = "Nada foi alterado."
"Pulling changes…" = "Baixando alterações…"
"Push your commits or reset the branch yourself; Axion never rewrites your history." = "Envie seus commits ou redefina o branch você mesmo; o Axion nunca reescreve seu histórico."
"Rebase or merge the branch yourself (git pull --rebase), then try again. Axion never does it for you." = "Faça rebase ou merge do branch você mesmo (git pull --rebase) e tente de novo. O Axion nunca faz isso por você."
"Restart Axion to start using it." = "Reinicie o Axion para começar a usá-lo."
"Starting…" = "Iniciando…"
"The checkout has diverged from {upstream}: {ahead} local and {behind} new commit(s)." = "O checkout divergiu de {upstream}: {ahead} commit(s) local(is) e {behind} novo(s) commit(s)."
"The checkout has uncommitted changes to tracked files, so Axion left it alone." = "O checkout tem alterações não commitadas em arquivos rastreados, então o Axion não mexeu nele."
"The checkout is {ahead} commit(s) ahead of {upstream} and has nothing new to take from it." = "O checkout está {ahead} commit(s) à frente de {upstream} e não tem nada novo para trazer dele."
"The checkout isn't on a branch that follows a remote branch." = "O checkout não está em um branch que acompanha um branch remoto."
"The checkout's remote ({remote}) isn't the configured repository ({repository})." = "O remoto do checkout ({remote}) não é o repositório configurado ({repository})."
"The current version was left as it was." = "A versão atual foi mantida como estava."
"The download doesn't match its published checksum, so it was discarded." = "O download não corresponde à soma de verificação publicada, então foi descartado."
"The download is checked against the release's published checksum first." = "O download é verificado primeiro contra a soma de verificação publicada do lançamento."
"The download is larger than the allowed size." = "O download é maior que o tamanho permitido."
"The download matched its published checksum." = "O download corresponde à soma de verificação publicada."
"The downloaded archive was rejected: {why}" = "O arquivo baixado foi rejeitado: {why}"
"The new version is unpacked and checked. It replaces the current one when Axion restarts; the current one is kept as a backup." = "A nova versão foi descompactada e verificada. Ela substitui a atual quando o Axion reiniciar; a atual é mantida como backup."
"The source was updated and built. Restart Axion to finish the update: until then this window still runs the old build." = "O código-fonte foi atualizado e compilado. Reinicie o Axion para concluir a atualização: até lá, esta janela ainda executa a versão antiga."
"The source was updated, but building it failed. The previous build is still in place." = "O código-fonte foi atualizado, mas a compilação falhou. A compilação anterior continua no lugar."
"The update server sent something Axion doesn't understand." = "O servidor de atualizações enviou algo que o Axion não entende."
"This installation is managed elsewhere or needs permissions. Download the new version from the release page." = "Esta instalação é gerenciada em outro lugar ou precisa de permissões. Baixe a nova versão na página de lançamentos."
"This release has no download for this installation." = "Este lançamento não tem download para esta instalação."
"This release publishes no checksum, so the download can't be verified." = "Este lançamento não publica soma de verificação, então o download não pode ser verificado."
"This release publishes no checksum, so the download could not be verified." = "Este lançamento não publica soma de verificação, então o download não pôde ser verificado."
"Unpacking the new version…" = "Descompactando a nova versão…"
"Update Axion to {version}?" = "Atualizar o Axion para {version}?"
"Update failed" = "Falha na atualização"
"Update from Git?" = "Atualizar pelo Git?"
"Updated to {version}" = "Atualizado para {version}"
"Updating Axion…" = "Atualizando o Axion…"
"Updating from Git…" = "Atualizando pelo Git…"
"Verifying the download…" = "Verificando o download…"
"size unknown" = "tamanho desconhecido"
"the AppImage" = "o AppImage"
"the tarball" = "o tarball"
"…and {count} more" = "…e mais {count}"

