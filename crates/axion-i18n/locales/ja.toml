"The source was updated and built. Restart Axion to finish the update: until then this window still runs the old build." = "ソースを更新してビルドしました。アップデートを完了するには Axion を再起動してください。それまでこのウインドウは古いビルドで動作します。"
"The source was updated, but building it failed. The previous build is still in place." = "ソースは更新されましたが、ビルドに失敗しました。以前のビルドはそのまま残っています。"
"The update server sent something Axion doesn't understand." = "アップデートサーバーから、Axion が理解できないデータが送られてきました。"
"This installation is managed elsewhere or needs permissions. Download the new version from the release page." = "このインストールは別途管理されているか、権限が必要です。リリースページから新しいバージョンをダウンロードしてください。"
