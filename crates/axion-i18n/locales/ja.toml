# crates/axion-app/src/update.rs
"Axion can't write to {path}, so it can't replace this installation." = "Axion は {path} に書き込めないため、このインストールを置き換えられません。"
"Axion downloads {file} ({size}) and replaces {path}. The current version is kept next to it as {backup}." = "Axion は {file}（{size}）をダウンロードし、{path} を置き換えます。現在のバージョンは {backup} として横に残されます。"
"Axion downloads {file} ({size}) and unpacks it next to {path}. {path} itself is replaced only when you restart Axion; the current version is kept as a backup." = "Axion は {file}（{size}）をダウンロードし、{path} の横に展開します。{path} 自体は Axion の再起動時にのみ置き換えられ、現在のバージョンはバックアップとして残されます。"
"Building Axion… this takes a while." = "Axion をビルドしています…。しばらくかかります。"
"Changes to tracked files stop the update; untracked files are fine. Local commits are never merged, rebased or reset, and nothing is forced." = "追跡中のファイルに変更があるとアップデートは中止されます。追跡されていないファイルは問題ありません。ローカルのコミットはマージ、リベース、リセットされることはなく、強制もされません。"
"Checking the working tree…" = "作業ツリーを確認しています…"
"Commit, stash or revert these changes (see “git status”), then try again. Untracked files do not matter." = "これらの変更をコミット、スタッシュ、または取り消してから（“git status” を参照）、もう一度お試しください。追跡されていないファイルは関係ありません。"
"Couldn't reach the update server. Check your connection and try again." = "アップデートサーバーに接続できませんでした。接続を確認して、もう一度お試しください。"
"Downloading… {done}" = "ダウンロード中… {done}"
"Downloading… {done} of {total}" = "ダウンロード中… {done} / {total}"
"Fetching changes…" = "変更を取得しています…"
"In {path}, Axion runs “git fetch”, then “git pull --ff-only” if there is something new, and “cargo build -p axion-app --release”. This can take several minutes." = "{path} で、Axion は “git fetch” を実行し、新しい変更があれば “git pull --ff-only” を、続いて “cargo build -p axion-app --release” を実行します。数分かかることがあります。"
"No update source is set yet." = "アップデートの取得元がまだ設定されていません。"
"Nothing was changed." = "何も変更されませんでした。"
"Pulling changes…" = "変更を取り込んでいます…"
"Push your commits or reset the branch yourself; Axion never rewrites your history." = "コミットをプッシュするか、ブランチを自分でリセットしてください。Axion が履歴を書き換えることはありません。"
"Rebase or merge the branch yourself (git pull --rebase), then try again. Axion never does it for you." = "ブランチを自分でリベースまたはマージ（git pull --rebase）してから、もう一度お試しください。Axion が代わりに行うことはありません。"
"Restart Axion to start using it." = "使用を開始するには Axion を再起動してください。"
"Starting…" = "開始しています…"
"The checkout has diverged from {upstream}: {ahead} local and {behind} new commit(s)." = "チェックアウトが {upstream} から分岐しています: ローカル {ahead} 件、新しいコミット {behind} 件。"
"The checkout has uncommitted changes to tracked files, so Axion left it alone." = "チェックアウトに追跡中のファイルの未コミットの変更があるため、Axion は何もしませんでした。"
"The checkout is {ahead} commit(s) ahead of {upstream} and has nothing new to take from it." = "チェックアウトは {upstream} より {ahead} 件先行しており、取り込む新しい変更はありません。"
"The checkout isn't on a branch that follows a remote branch." = "チェックアウトは、リモートブランチを追跡するブランチ上にありません。"
"The checkout's remote ({remote}) isn't the configured repository ({repository})." = "チェックアウトのリモート（{remote}）が、設定されたリポジトリ（{repository}）と一致しません。"
"The current version was left as it was." = "現在のバージョンはそのまま残されました。"
"The download doesn't match its published checksum, so it was discarded." = "ダウンロードされたファイルが公開されているチェックサムと一致しないため、破棄されました。"
"The download is checked against the release's published checksum first." = "ダウンロードは、まずリリースで公開されているチェックサムと照合されます。"
