# crates/axion-app/src/update.rs
"Axion can't write to {path}, so it can't replace this installation." = "Axion не может записывать в {path}, поэтому не может заменить эту установку."
"Axion downloads {file} ({size}) and replaces {path}. The current version is kept next to it as {backup}." = "Axion загружает {file} ({size}) и заменяет {path}. Текущая версия сохраняется рядом как {backup}."
"Axion downloads {file} ({size}) and unpacks it next to {path}. {path} itself is replaced only when you restart Axion; the current version is kept as a backup." = "Axion загружает {file} ({size}) и распаковывает его рядом с {path}. Сам {path} заменяется только при перезапуске Axion; текущая версия сохраняется как резервная копия."
"Building Axion… this takes a while." = "Сборка Axion… это займёт некоторое время."
"Changes to tracked files stop the update; untracked files are fine. Local commits are never merged, rebased or reset, and nothing is forced." = "Изменения отслеживаемых файлов останавливают обновление; неотслеживаемые файлы не мешают. Локальные коммиты никогда не объединяются, не перебазируются и не сбрасываются, ничего не делается принудительно."
"Checking the working tree…" = "Проверка рабочей копии…"
"Commit, stash or revert these changes (see “git status”), then try again. Untracked files do not matter." = "Зафиксируйте, спрячьте или откатите эти изменения (см. «git status»), затем попробуйте снова. Неотслеживаемые файлы не важны."
"Couldn't reach the update server. Check your connection and try again." = "Не удалось подключиться к серверу обновлений. Проверьте подключение и попробуйте снова."
"Downloading… {done}" = "Загрузка… {done}"
"Downloading… {done} of {total}" = "Загрузка… {done} из {total}"
"Fetching changes…" = "Получение изменений…"
"In {path}, Axion runs “git fetch”, then “git pull --ff-only” if there is something new, and “cargo build -p axion-app --release”. This can take several minutes." = "В {path} Axion выполняет «git fetch», затем «git pull --ff-only», если есть новое, и «cargo build -p axion-app --release». Это может занять несколько минут."
"No update source is set yet." = "Источник обновлений ещё не задан."
"Nothing was changed." = "Ничего не изменено."
"Pulling changes…" = "Загрузка изменений…"
"Push your commits or reset the branch yourself; Axion never rewrites your history." = "Отправьте свои коммиты или сбросьте ветку сами; Axion никогда не переписывает вашу историю."
"Rebase or merge the branch yourself (git pull --rebase), then try again. Axion never does it for you." = "Выполните rebase или merge ветки сами (git pull --rebase), затем попробуйте снова. Axion никогда не делает это за вас."
"Restart Axion to start using it." = "Перезапустите Axion, чтобы начать его использовать."
"Starting…" = "Запуск…"
"The checkout has diverged from {upstream}: {ahead} local and {behind} new commit(s)." = "Рабочая копия разошлась с {upstream}: локальных коммитов: {ahead}, новых: {behind}."
"The checkout has uncommitted changes to tracked files, so Axion left it alone." = "В рабочей копии есть незафиксированные изменения отслеживаемых файлов, поэтому Axion её не трогал."
"The checkout is {ahead} commit(s) ahead of {upstream} and has nothing new to take from it." = "Рабочая копия опережает {upstream} на коммитов: {ahead}, и взять оттуда нечего."
"The checkout isn't on a branch that follows a remote branch." = "Рабочая копия не находится в ветке, которая следует за удалённой веткой."
"The checkout's remote ({remote}) isn't the configured repository ({repository})." = "Удалённый репозиторий рабочей копии ({remote}) не совпадает с настроенным ({repository})."
"The current version was left as it was." = "Текущая версия оставлена без изменений."
"The download doesn't match its published checksum, so it was discarded." = "Загрузка не совпадает с опубликованной контрольной суммой, поэтому она отброшена."
"The download is checked against the release's published checksum first." = "Загрузка сначала проверяется по опубликованной контрольной сумме релиза."
"The download is larger than the allowed size." = "Загрузка больше допустимого размера."
"The download matched its published checksum." = "Загрузка совпала с опубликованной контрольной суммой."
"The downloaded archive was rejected: {why}" = "Загруженный архив отклонён: {why}"
"The new version is unpacked and checked. It replaces the current one when Axion restarts; the current one is kept as a backup." = "Новая версия распакована и проверена. Она заменит текущую при перезапуске Axion; текущая версия сохраняется как резервная копия."
"The source was updated and built. Restart Axion to finish the update: until then this window still runs the old build." = "Исходный код обновлён и собран. Перезапустите Axion, чтобы завершить обновление: до этого в этом окне работает старая сборка."
"The source was updated, but building it failed. The previous build is still in place." = "Исходный код обновлён, но сборка не удалась. Предыдущая сборка осталась на месте."
"The update server sent something Axion doesn't understand." = "Сервер обновлений отправил то, что Axion не понимает."
"This installation is managed elsewhere or needs permissions. Download the new version from the release page." = "Эта установка управляется в другом месте или требует прав. Скачайте новую версию на странице релизов."
"This release has no download for this installation." = "Для этой установки в этом релизе нет загрузки."
"This release publishes no checksum, so the download can't be verified." = "Этот релиз не публикует контрольную сумму, поэтому загрузку нельзя проверить."
"This release publishes no checksum, so the download could not be verified." = "Этот релиз не публикует контрольную сумму, поэтому загрузку не удалось проверить."
"Unpacking the new version…" = "Распаковка новой версии…"
"Update Axion to {version}?" = "Обновить Axion до {version}?"
"Update failed" = "Не удалось обновить"
"Update from Git?" = "Обновить из Git?"
"Updated to {version}" = "Обновлено до {version}"
"Updating Axion…" = "Обновление Axion…"
"Updating from Git…" = "Обновление из Git…"
"Verifying the download…" = "Проверка загрузки…"
"size unknown" = "размер неизвестен"
"the AppImage" = "AppImage"
"the tarball" = "архив"
"…and {count} more" = "…и ещё {count}"

