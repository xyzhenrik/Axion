# crates/axion-app/src/settings/network.rs
"Config read. Keys will be stored encrypted with this device's key." = "Konfiguracja odczytana. Klucze będą zapisane zaszyfrowane kluczem tego urządzenia."
"The password is stored encrypted with this device's key, not in the settings file. Names are always resolved by the proxy, never on this computer." = "Hasło jest zapisane zaszyfrowane kluczem tego urządzenia, a nie w pliku ustawień. Nazwy są zawsze rozpoznawane przez proxy, nigdy na tym komputerze."
"The private key and any preshared keys are stored encrypted with this device's key. Scripts in the config (PostUp and the like) are never run." = "Klucz prywatny i wszelkie klucze współdzielone są zapisane zaszyfrowane kluczem tego urządzenia. Skrypty w konfiguracji (PostUp i podobne) nigdy nie są uruchamiane."
"These connections still keep a password or key in your password vault from an older version. Unlock Passwords (Settings › Passwords) once and they connect; the secrets then move out of the vault." = "Te połączenia nadal mają hasło lub klucz w skarbcu haseł ze starszej wersji. Odblokuj hasła (Ustawienia › Hasła) raz, a połączą się; dane uwierzytelniające zostaną wtedy przeniesione poza skarbiec."

