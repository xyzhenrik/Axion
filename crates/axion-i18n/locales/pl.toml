# crates/axion-app/src/update.rs
"Axion can't write to {path}, so it can't replace this installation." = "Axion nie może zapisać w {path}, więc nie może zastąpić tej instalacji."
"Axion downloads {file} ({size}) and replaces {path}. The current version is kept next to it as {backup}." = "Axion pobiera {file} ({size}) i zastępuje {path}. Obecna wersja zostanie zachowana obok jako {backup}."
"Axion downloads {file} ({size}) and unpacks it next to {path}. {path} itself is replaced only when you restart Axion; the current version is kept as a backup." = "Axion pobiera {file} ({size}) i rozpakowuje go obok {path}. Sam {path} zostaje zastąpiony dopiero po ponownym uruchomieniu Axion; obecna wersja zostaje zachowana jako kopia zapasowa."
"Building Axion… this takes a while." = "Kompilowanie Axion… to chwilę potrwa."
"Changes to tracked files stop the update; untracked files are fine. Local commits are never merged, rebased or reset, and nothing is forced." = "Zmiany w śledzonych plikach wstrzymują aktualizację; niepodlegające śledzeniu pliki nie szkodzą. Lokalne commity nigdy nie są scalane, rebazowane ani resetowane, i nic nie jest wymuszane."
"Checking the working tree…" = "Sprawdzanie katalogu roboczego…"
"Commit, stash or revert these changes (see “git status”), then try again. Untracked files do not matter." = "Zatwierdź, odłóż lub cofnij te zmiany (zob. “git status”), a następnie spróbuj ponownie. Niepodlegające śledzeniu pliki nie mają znaczenia."
"Couldn't reach the update server. Check your connection and try again." = "Nie udało się połączyć z serwerem aktualizacji. Sprawdź połączenie i spróbuj ponownie."
"Downloading… {done}" = "Pobieranie… {done}"
"Downloading… {done} of {total}" = "Pobieranie… {done} z {total}"
"Fetching changes…" = "Pobieranie zmian…"
"In {path}, Axion runs “git fetch”, then “git pull --ff-only” if there is something new, and “cargo build -p axion-app --release”. This can take several minutes." = "W {path} Axion uruchamia “git fetch”, następnie “git pull --ff-only”, jeśli jest coś nowego, oraz “cargo build -p axion-app --release”. Może to potrwać kilka minut."
"No update source is set yet." = "Nie ustawiono jeszcze źródła aktualizacji."
"Nothing was changed." = "Nic nie zmieniono."
"Pulling changes…" = "Pobieranie zmian…"
"Push your commits or reset the branch yourself; Axion never rewrites your history." = "Wypchnij swoje commity lub zresetuj gałąź samodzielnie; Axion nigdy nie przepisuje historii."
"Rebase or merge the branch yourself (git pull --rebase), then try again. Axion never does it for you." = "Zrób rebase lub scal gałąź samodzielnie (git pull --rebase), a następnie spróbuj ponownie. Axion nigdy nie robi tego za Ciebie."
"Restart Axion to start using it." = "Uruchom ponownie Axion, aby zacząć z niego korzystać."
"Starting…" = "Uruchamianie…"
"The checkout has diverged from {upstream}: {ahead} local and {behind} new commit(s)." = "Kopia robocza rozeszła się z {upstream}: {ahead} lokalnych i {behind} nowych commitów."
"The checkout has uncommitted changes to tracked files, so Axion left it alone." = "Kopia robocza ma niezatwierdzone zmiany w śledzonych plikach, więc Axion jej nie ruszył."
"The checkout is {ahead} commit(s) ahead of {upstream} and has nothing new to take from it." = "Kopia robocza ma {ahead} commitów przed {upstream} i nie ma z niego nic nowego do pobrania."
"The checkout isn't on a branch that follows a remote branch." = "Kopia robocza nie jest na gałęzi śledzącej gałąź zdalną."
"The checkout's remote ({remote}) isn't the configured repository ({repository})." = "Zdalne repozytorium kopii roboczej ({remote}) nie jest skonfigurowanym repozytorium ({repository})."
"The current version was left as it was." = "Obecna wersja pozostała bez zmian."
"The download doesn't match its published checksum, so it was discarded." = "Pobrany plik nie zgadza się z opublikowaną sumą kontrolną, więc został odrzucony."
"The download is checked against the release's published checksum first." = "Pobrany plik jest najpierw sprawdzany opublikowaną sumą kontrolną wydania."
"The download is larger than the allowed size." = "Pobrany plik jest większy niż dozwolony rozmiar."
"The download matched its published checksum." = "Pobrany plik zgadza się z opublikowaną sumą kontrolną."
"The downloaded archive was rejected: {why}" = "Pobrane archiwum zostało odrzucone: {why}"
"The new version is unpacked and checked. It replaces the current one when Axion restarts; the current one is kept as a backup." = "Nowa wersja jest rozpakowana i sprawdzona. Zastąpi obecną po ponownym uruchomieniu Axion; obecna zostaje zachowana jako kopia zapasowa."
"The source was updated and built. Restart Axion to finish the update: until then this window still runs the old build." = "Źródła zostały zaktualizowane i skompilowane. Uruchom ponownie Axion, aby zakończyć aktualizację: do tego czasu to okno nadal działa ze starą wersją."
"The source was updated, but building it failed. The previous build is still in place." = "Źródła zostały zaktualizowane, ale kompilacja się nie powiodła. Poprzednia wersja nadal działa."
"The update server sent something Axion doesn't understand." = "Serwer aktualizacji wysłał coś, czego Axion nie rozumie."
"This installation is managed elsewhere or needs permissions. Download the new version from the release page." = "Ta instalacja jest zarządzana gdzie indziej lub wymaga uprawnień. Pobierz nową wersję ze strony wydania."
"This release has no download for this installation." = "To wydanie nie ma pliku do pobrania dla tej instalacji."
"This release publishes no checksum, so the download can't be verified." = "To wydanie nie publikuje sumy kontrolnej, więc pobranego pliku nie można zweryfikować."
"This release publishes no checksum, so the download could not be verified." = "To wydanie nie publikuje sumy kontrolnej, więc pobranego pliku nie udało się zweryfikować."
"Unpacking the new version…" = "Rozpakowywanie nowej wersji…"
"Update Axion to {version}?" = "Zaktualizować Axion do wersji {version}?"
"Update failed" = "Aktualizacja nie powiodła się"
"Update from Git?" = "Zaktualizować z Git?"
"Updated to {version}" = "Zaktualizowano do wersji {version}"
"Updating Axion…" = "Aktualizowanie Axion…"
"Updating from Git…" = "Aktualizowanie z Git…"
"Verifying the download…" = "Weryfikowanie pobranego pliku…"
"size unknown" = "nieznany rozmiar"
"the AppImage" = "AppImage"
