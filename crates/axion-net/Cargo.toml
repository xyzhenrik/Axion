[package]
name = "axion-net"
description = "Axion's privacy network: upstream proxies, WireGuard and Tor behind one tunnel interface, routing rules, leak protection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror.workspace = true
tracing.workspace = true
zeroize = { version = "1", features = ["derive"] }

# Tor (Arti, the Tor Project's Rust client). rustls instead of OpenSSL; the tokio runtime stays
# private to src/tor/. `stream-ctrl` and `experimental-api` give the circuit path of a stream.
arti-client = { version = "0.47", default-features = false, features = ["tokio", "rustls", "compression", "onion-service-client", "bridge-client", "geoip", "experimental-api"] }
tor-rtcompat = { version = "0.47", default-features = false, features = ["tokio", "rustls"] }
tor-proto = { version = "0.47", default-features = false, features = ["stream-ctrl"] }
tor-linkspec = "0.47"
tor-geoip = "0.47"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "io-util", "time", "sync", "macros"] }
futures = { version = "0.3", default-features = false, features = ["std", "alloc"] }
addr = { version = "0.15", default-features = false, features = ["psl"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
toml = "1"

[lints]
workspace = true
