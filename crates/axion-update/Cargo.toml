[package]
name = "axion-update"
description = "Axion's updater: release lookup (GitHub Releases or a JSON manifest), checksum verification, AppImage and source-checkout updates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axion-config.workspace = true
flate2 = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
thiserror.workspace = true
tracing.workspace = true
ureq = "3"
url = "2"

[dev-dependencies]
tempfile = "3"
toml = "1"

[lints]
workspace = true
