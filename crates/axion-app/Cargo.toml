[package]
name = "axion-app"
description = "The Axion browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "axion"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
axion-accounts.workspace = true
axion-compositor.workspace = true
axion-config.workspace = true
axion-engine.workspace = true
axion-media.workspace = true
axion-physics.workspace = true
axion-shields.workspace = true
axion-tabs.workspace = true
axion-store.workspace = true
axion-ui.workspace = true
axion-vault = { workspace = true }
directories = "6"
glam.workspace = true
image.workspace = true
jiff = "0.2"
pollster.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wgpu.workspace = true
winit.workspace = true
zbus = "5"
zeroize = "1"

[features]
# The vault's device key is sealed with the TPM (needs libtss2-esys to build); without it the
# device key lives in a file.
default = ["tpm"]
tpm = ["axion-vault/tpm"]

[lints]
workspace = true
