[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT"
repository = "https://github.com/xyzhenrik/Axion"

[workspace.dependencies]
ash = "0.38"
libc = "0.2"
axion-compositor = { path = "crates/axion-compositor" }
axion-accounts = { path = "crates/axion-accounts" }
axion-config = { path = "crates/axion-config" }
axion-engine = { path = "crates/axion-engine" }
axion-extensions = { path = "crates/axion-extensions" }
axion-glass = { path = "crates/axion-glass" }
axion-i18n = { path = "crates/axion-i18n" }
axion-import = { path = "crates/axion-import" }
axion-physics = { path = "crates/axion-physics" }
axion-shields = { path = "crates/axion-shields" }
axion-tabs = { path = "crates/axion-tabs" }
axion-net = { path = "crates/axion-net" }
axion-media = { path = "crates/axion-media" }
axion-reader = { path = "crates/axion-reader" }
axion-translate = { path = "crates/axion-translate" }
axion-store = { path = "crates/axion-store" }
axion-ui = { path = "crates/axion-ui" }
axion-update = { path = "crates/axion-update" }
axion-vault = { path = "crates/axion-vault", default-features = false }

anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
cef = { version = "156.2", features = ["accelerated_osr"] }
glam = { version = "0.34", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "bmp", "gif", "webp"] }
pollster = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "30"
winit = "0.30"

# The userspace WireGuard stack (axion-net) runs its crypto and TCP/IP code in debug builds
# too: keep it fast enough that the loopback tests move tens of megabytes in seconds.
[profile.dev.package.boringtun]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.smoltcp]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
